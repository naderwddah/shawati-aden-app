<!doctype html>
<html dir="rtl" lang="ar" data-page="booking-new">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#8F1720" />
    <meta name="description" content="حجز جديد - شواطئ عدن" />
    <title>حجز جديد - شواطئ عدن</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/css/global.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="assets/images/logo.png" />
  </head>
  <body>
    <div id="loadingScreen" class="loading-screen">
      <div class="loading-content">
        <div class="loading-logo"><i class="fas fa-utensils"></i></div>
        <h1 class="loading-title">شواطئ عدن</h1>
        <p class="loading-subtitle">مطابخ ومطاعم</p>
        <div class="loading-dots"><span></span><span></span><span></span></div>
      </div>
    </div>

    <div class="app">
      <aside id="sidebar" class="sidebar"></aside>
      <div id="sidebarOverlay" class="sidebar-overlay"></div>
      <div class="main-area">
        <header id="header" class="header"></header>
        <main class="content" id="pageContent">
          <div class="page-header">
            <div>
              <h1 class="page-title">حجز جديد</h1>
              <p class="page-subtitle">أضف حجزاً جديداً لقاعات المناسبات</p>
            </div>
          </div>

          <form id="bookingForm" class="card" style="max-width: 720px">
            <!-- Customer Information -->
            <div class="form-section">
              <h3 class="form-section-title">
                <i class="fas fa-user"></i> معلومات العميل
              </h3>
              <div class="form-grid form-grid-2">
                <div class="form-group">
                  <label class="form-label"
                    >اسم العميل <span class="req">*</span></label
                  >
                  <input
                    type="text"
                    class="form-input"
                    id="customerName"
                    placeholder="أدخل الاسم الكامل"
                  />
                </div>
                <div class="form-group">
                  <label class="form-label"
                    >رقم الهاتف <span class="req">*</span></label
                  >
                  <input
                    type="tel"
                    class="form-input"
                    id="customerPhone"
                    placeholder="05XXXXXXXX"
                    inputmode="tel"
                    style="direction: ltr; text-align: end"
                  />
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">البريد الإلكتروني</label>
                <input
                  type="email"
                  class="form-input"
                  id="customerEmail"
                  placeholder="example@email.com"
                  style="direction: ltr; text-align: end"
                />
              </div>
            </div>

            <!-- Reservation Information -->
            <div class="form-section">
              <h3 class="form-section-title">
                <i class="fas fa-calendar"></i> معلومات الحجز
              </h3>
              <div class="form-grid form-grid-2">
                <div class="form-group">
                  <label class="form-label"
                    >التاريخ <span class="req">*</span></label
                  >
                  <input type="date" class="form-input" id="date" />
                </div>
                <div class="form-group">
                  <label class="form-label"
                    >الوقت <span class="req">*</span></label
                  >
                  <input
                    type="time"
                    class="form-input"
                    id="time"
                    value="19:00"
                  />
                </div>
              </div>
              <div class="form-grid form-grid-2">
                <div class="form-group">
                  <label class="form-label"
                    >عدد الضيوف <span class="req">*</span></label
                  >
                  <input
                    type="number"
                    class="form-input"
                    id="guests"
                    placeholder="0"
                    min="1"
                    inputmode="numeric"
                  />
                </div>
                <div class="form-group">
                  <label class="form-label"
                    >القاعة <span class="req">*</span></label
                  >
                  <select class="form-select" id="hall"></select>
                </div>
              </div>
            </div>

            <!-- Event Details -->
            <div class="form-section">
              <h3 class="form-section-title">
                <i class="fas fa-star"></i> تفاصيل المناسبة
              </h3>
              <div class="form-group">
                <label class="form-label">نوع المناسبة</label>
                <select class="form-select" id="eventType"></select>
              </div>
              <div class="form-group">
                <label class="form-label">ملاحظات</label>
                <textarea
                  class="form-textarea"
                  id="notes"
                  placeholder="أي ملاحظات أو طلبات خاصة..."
                ></textarea>
              </div>
            </div>

            <!-- Financial Information -->
            <div class="form-section">
              <h3 class="form-section-title">
                <i class="fas fa-money-bill"></i> المعلومات المالية
              </h3>
              <div class="form-grid form-grid-2">
                <div class="form-group">
                  <label class="form-label">المبلغ الإجمالي</label>
                  <input
                    type="number"
                    class="form-input"
                    id="total"
                    placeholder="0"
                    min="0"
                    inputmode="numeric"
                  />
                </div>
                <div class="form-group">
                  <label class="form-label">الدفعة المقدمة</label>
                  <input
                    type="number"
                    class="form-input"
                    id="paid"
                    placeholder="0"
                    min="0"
                    inputmode="numeric"
                  />
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">المبلغ المتبقي</label>
                <input
                  type="number"
                  class="form-input"
                  id="remaining"
                  readonly
                />
                <p
                  class="form-hint"
                  id="remainingDisplay"
                  style="
                    font-weight: 700;
                    color: var(--danger);
                    font-size: 14px;
                    margin-top: 8px;
                  "
                >
                  0 ريال
                </p>
              </div>
            </div>

            <!-- Actions -->
            <div class="flex gap-3 mt-6">
              <button
                type="button"
                class="btn btn-secondary btn-block"
                id="cancelBtn"
              >
                إلغاء
              </button>
              <button
                type="submit"
                class="btn btn-primary btn-block"
                id="saveBtn"
              >
                <i class="fas fa-check"></i>
                <span>حفظ الحجز</span>
              </button>
            </div>
          </form>
        </main>
      </div>
    </div>

    <nav id="bottomNav" class="bottom-nav"></nav>
    <button id="fab" class="fab" aria-label="حجز جديد">
      <i class="fas fa-plus"></i>
    </button>
    <div id="modalContainer"></div>
    <div id="toastContainer" class="toast-container"></div>

    <script src="assets/js/core/utils.js"></script>
    <script src="assets/js/core/state.js"></script>
    <script src="assets/js/core/api.js"></script>
    <script src="assets/js/components/layout.js"></script>
    <script src="assets/js/pages/booking-form.js"></script>
  </body>
</html>
