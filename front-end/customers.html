<!doctype html>
<html dir="rtl" lang="ar" data-page="customers">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#8F1720" />
    <title>العملاء - شواطئ عدن</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="assets/css/global.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="assets/images/logo.png" />
    <style>
      .customers-summary {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: var(--space-4);
        padding: 12px;
        background: var(--surface-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-sm);
      }

      .summary-item {
        text-align: center;
      }

      .summary-label {
        display: block;
        font-size: 11px;
        color: var(--text-muted);
        margin-bottom: 2px;
      }

      .summary-value {
        font-size: 18px;
        font-weight: 800;
        color: var(--text);
      }

      .summary-value.danger {
        color: var(--danger);
      }

      .customer-card {
        display: flex;
        align-items: stretch;
        background: var(--surface-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 14px 16px;
        margin-bottom: var(--space-2);
        box-shadow: var(--shadow-sm);
        transition: all 0.15s ease;
        gap: var(--space-3);
        position: relative;
      }

      .customer-card.inactive {
        opacity: 0.7;
      }

      .customer-card .click-area {
        flex: 1;
        display: flex;
        align-items: stretch;
        gap: var(--space-3);
        cursor: pointer;
        min-width: 0;
      }

      .customer-card .click-area:active {
        transform: scale(0.99);
      }

      .customer-card .avatar {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border-radius: var(--radius-sm);
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 18px;
        font-weight: 700;
        flex-shrink: 0;
      }

      .customer-card .info {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .customer-card .info .name {
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
        line-height: 1.3;
      }

      .customer-card .info .phone {
        font-size: 13px;
        color: var(--text-muted);
        direction: ltr;
        text-align: start;
      }

      .customer-card .financial {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-3);
        margin-top: 4px;
        font-size: 12px;
        color: var(--text-secondary);
      }

      .customer-card .financial .label {
        color: var(--text-muted);
        margin-left: 2px;
      }

      .customer-card .financial .amount {
        font-weight: 700;
      }

      .customer-card .financial .remaining {
        color: var(--danger);
        font-weight: 800;
      }

      .customer-card .financial .paid {
        color: var(--success);
      }

      .customer-card .actions {
        display: flex;
        align-items: center;
        gap: var(--space-1);
        flex-shrink: 0;
      }

      .customer-card .actions .arrow {
        display: flex;
        align-items: center;
        color: var(--text-muted);
        font-size: 14px;
      }

      .customer-status {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        margin-top: 4px;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 700;
      }

      .customer-status.active {
        color: var(--success);
        background: color-mix(in srgb, var(--success) 10%, transparent);
      }

      .customer-status.inactive {
        color: var(--danger);
        background: color-mix(in srgb, var(--danger) 10%, transparent);
      }

      .customer-action {
        width: 34px;
        height: 34px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: var(--radius-sm);
        cursor: pointer;
      }

      .customer-action.edit {
        color: var(--primary);
        background: var(--primary-soft);
      }

      .customer-action.toggle {
        color: var(--warning);
        background: color-mix(in srgb, var(--warning) 10%, transparent);
      }

      .customer-action.activate {
        color: var(--success);
        background: color-mix(in srgb, var(--success) 10%, transparent);
      }

      .modal-form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
      }

      .modal-form-grid .full {
        grid-column: 1 / -1;
      }

      .page-header .btn-sm {
        display: none;
      }

      @media (max-width: 767px) {
        .customers-summary {
          grid-template-columns: repeat(3, 1fr);
          padding: 10px;
          gap: 6px;
        }

        .summary-value {
          font-size: 16px;
        }

        .customer-card {
          padding: 12px 14px;
        }

        .customer-card .avatar {
          width: 38px;
          height: 38px;
          font-size: 15px;
        }

        .customer-card .info .name {
          font-size: 14px;
        }

        .customer-card .info .phone {
          font-size: 12px;
        }

        .customer-card .financial {
          font-size: 11px;
          gap: var(--space-2);
        }

        .customer-action {
          width: 31px;
          height: 31px;
        }

        .modal-form-grid {
          grid-template-columns: 1fr;
        }

        .modal-form-grid .full {
          grid-column: auto;
        }
      }

      @media (min-width: 768px) {
        .page-header .btn-sm {
          display: inline-flex;
        }

        .customers-summary {
          padding: 16px 20px;
        }

        .summary-value {
          font-size: 22px;
        }

        .customer-card {
          padding: 16px 20px;
        }

        .customer-card .avatar {
          width: 50px;
          height: 50px;
          font-size: 20px;
        }

        .customer-card .info .name {
          font-size: 17px;
        }
      }

      @media (min-width: 1024px) {
        #customersList {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: var(--space-3);
        }

        .customer-card {
          margin-bottom: 0;
        }
      }
    </style>
  </head>

  <body>
    <div id="loadingScreen" class="loading-screen">
      <div class="loading-content">
        <div class="loading-logo"><i class="fas fa-utensils"></i></div>
        <h1 class="loading-title">شواطئ عدن</h1>
        <p class="loading-subtitle">مطابخ ومطاعم</p>
        <div class="loading-dots"><span></span><span></span><span></span></div>
      </div>
    </div>

    <div class="app">
      <aside id="sidebar" class="sidebar"></aside>
      <div id="sidebarOverlay" class="sidebar-overlay"></div>

      <div class="main-area">
        <header id="header" class="header"></header>

        <main class="content" id="pageContent">
          <div class="page-header">
            <div>
              <h1 class="page-title">العملاء</h1>
              <p class="page-subtitle">إدارة العملاء والحسابات المالية</p>
            </div>

            <button class="btn btn-primary btn-sm" id="addCustomerBtn">
              <i class="fas fa-user-plus"></i>
              <span>عميل جديد</span>
            </button>
          </div>

          <div class="customers-summary">
            <div class="summary-item">
              <span class="summary-label">إجمالي العملاء</span>
              <span class="summary-value" id="customersCount">0</span>
            </div>

            <div class="summary-item">
              <span class="summary-label">إجمالي المستحقات</span>
              <span class="summary-value danger" id="customersReceivables">0 ر.س</span>
            </div>

            <div class="summary-item">
              <span class="summary-label">إجمالي المحصل</span>
              <span class="summary-value" id="customersCollected">0 ر.س</span>
            </div>
          </div>

          <div class="search-bar">
            <i class="fas fa-search search-icon"></i>
            <input
              type="text"
              class="search-input"
              id="customerSearch"
              placeholder="ابحث عن اسم العميل أو رقم الجوال"
            />
          </div>

          <div id="customersList"></div>
        </main>
      </div>
    </div>

    <nav id="bottomNav" class="bottom-nav"></nav>

    <button id="fab" class="fab" aria-label="إضافة عميل">
      <i class="fas fa-plus"></i>
    </button>

    <div id="modalContainer"></div>
    <div id="toastContainer" class="toast-container"></div>

    <div class="modal" id="addCustomerModal" role="dialog" aria-modal="true">
      <div class="modal-overlay" data-close="addCustomerModal"></div>

      <div class="modal-dialog">
        <div class="modal-header">
          <h3 class="modal-title">إضافة عميل جديد</h3>
          <button class="modal-close" data-close="addCustomerModal" aria-label="إغلاق">
            <i class="fas fa-times"></i>
          </button>
        </div>

        <div class="modal-body">
          <div class="modal-form-grid">
            <div class="form-group">
              <label class="form-label" for="newCustomerName">
                الاسم <span class="req">*</span>
              </label>
              <input
                type="text"
                class="form-input"
                id="newCustomerName"
                placeholder="أدخل اسم العميل"
                autocomplete="off"
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="newCustomerPhone">
                رقم الجوال <span class="req">*</span>
              </label>
              <input
                type="tel"
                class="form-input"
                id="newCustomerPhone"
                placeholder="05xxxxxxxx"
                autocomplete="off"
              />
            </div>

            <div class="form-group full">
              <label class="form-label" for="newCustomerNotes">ملاحظات</label>
              <textarea
                class="form-input"
                id="newCustomerNotes"
                placeholder="ملاحظات العميل"
                rows="3"
              ></textarea>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn btn-secondary" data-close="addCustomerModal">إلغاء</button>
          <button class="btn btn-primary" id="saveNewCustomer">حفظ العميل</button>
        </div>
      </div>
    </div>

    <div class="modal" id="editCustomerModal" role="dialog" aria-modal="true">
      <div class="modal-overlay" data-close="editCustomerModal"></div>

      <div class="modal-dialog">
        <div class="modal-header">
          <h3 class="modal-title">تعديل العميل</h3>
          <button class="modal-close" data-close="editCustomerModal" aria-label="إغلاق">
            <i class="fas fa-times"></i>
          </button>
        </div>

        <div class="modal-body">
          <div class="modal-form-grid">
            <div class="form-group">
              <label class="form-label" for="editCustomerName">
                الاسم <span class="req">*</span>
              </label>
              <input
                type="text"
                class="form-input"
                id="editCustomerName"
                placeholder="اسم العميل"
                autocomplete="off"
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="editCustomerPhone">
                رقم الجوال <span class="req">*</span>
              </label>
              <input
                type="tel"
                class="form-input"
                id="editCustomerPhone"
                placeholder="05xxxxxxxx"
                autocomplete="off"
              />
            </div>

            <div class="form-group full">
              <label class="form-label" for="editCustomerNotes">ملاحظات</label>
              <textarea
                class="form-input"
                id="editCustomerNotes"
                placeholder="ملاحظات العميل"
                rows="3"
              ></textarea>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn btn-secondary" data-close="editCustomerModal">إلغاء</button>
          <button class="btn btn-primary" id="saveEditCustomer">حفظ التغييرات</button>
        </div>
      </div>
    </div>

    <script src="assets/js/core/utils.js"></script>
    <script src="assets/js/core/api.js"></script>
    <script src="assets/js/components/layout.js"></script>
    <script src="assets/js/pages/customers.js"></script>
  </body>
</html>
