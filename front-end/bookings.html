<!doctype html>
<html dir="rtl" lang="ar" data-page="bookings">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#8F1720">
  <meta name="description" content="إدارة الحجوزات - شواطئ عدن">
  <title>الحجوزات - شواطئ عدن</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <style>
    /* ===================== شريط الأدوات ===================== */
    .bookings-toolbar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .bookings-search { position: relative; }
    .bookings-search .search-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      font-size: 14px;
    }
    .bookings-search .search-input {
      width: 100%;
      padding-right: 42px;
      height: 46px;
      background: var(--surface-input, #fff);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .bookings-search .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
      outline: none;
    }

    /* ===================== فلاتر ===================== */
    .filter-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .filter-chips::-webkit-scrollbar { display: none; }

    .filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding: 0 14px;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      background: var(--surface-card, #fff);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .filter-chip:hover { border-color: var(--primary); }
    .filter-chip.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .filter-chip .chip-count {
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 800;
    }
    .filter-chip.active .chip-count {
      background: rgba(255,255,255,0.25);
      color: #fff;
    }

    /* ===================== بطاقات الملخص ===================== */
    .bookings-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .summary-box {
      padding: 12px 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-card, #fff);
      text-align: center;
    }
    .summary-label {
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .summary-value {
      color: var(--text);
      font-size: 17px;
      font-weight: 800;
      line-height: 1.2;
    }

    /* ===================== قائمة الحجوزات ===================== */
    .bookings-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 200px;
    }

    /* ===================== بطاقة الحجز ===================== */
    .booking-card {
      background: var(--surface-card, #fff);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 1px 3px rgba(0,0,0,.04);
      transition: box-shadow .2s, transform .2s;
    }
    .booking-card:hover {
      box-shadow: 0 4px 14px rgba(0,0,0,.08);
    }

    /* الرأس: العميل + الحالة */
    .booking-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .booking-head-info { min-width: 0; flex: 1; }
    .booking-name {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      margin: 0;
      line-height: 1.3;
    }
    .booking-phone {
      font-size: 12px;
      color: var(--text-muted);
      direction: ltr;
      text-align: right;
      margin-top: 2px;
    }
    .booking-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .booking-status-new { background: #fef3c7; color: #92400e; }
    .booking-status-confirmed { background: #d1fae5; color: #065f46; }
    .booking-status-completed { background: #e0e7ff; color: #3730a3; }
    .booking-status-cancelled { background: #fee2e2; color: #991b1b; }

    /* شريط التاريخ والوقت */
    .booking-datetime {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
      padding: 8px 10px;
      background: var(--surface-muted, #f9fafb);
      border-radius: 10px;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }
    .booking-datetime span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .booking-datetime i {
      color: var(--primary);
      font-size: 12px;
    }

    /* العلامة */
    .booking-mark {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #92400e;
      background: #fef3c7;
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    /* المربعات المالية الأربعة */
    .booking-finance {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .fin-box {
      padding: 8px 4px;
      border-radius: 10px;
      text-align: center;
      border: 1px solid transparent;
    }
    .fin-box.total { background: #f3f4f6; border-color: #e5e7eb; }
    .fin-box.paid { background: #ecfdf5; border-color: #d1fae5; }
    .fin-box.remaining { background: #fef2f2; border-color: #fee2e2; }
    .fin-box.deposit { background: #fff7ed; border-color: #fed7aa; }

    .fin-label {
      font-size: 10px;
      font-weight: 700;
      margin-bottom: 2px;
      line-height: 1.2;
    }
    .fin-box.total .fin-label { color: #6b7280; }
    .fin-box.paid .fin-label { color: #059669; }
    .fin-box.remaining .fin-label { color: #dc2626; }
    .fin-box.deposit .fin-label { color: #ea580c; }

    .fin-value {
      font-size: 13px;
      font-weight: 800;
      line-height: 1.2;
    }
    .fin-box.total .fin-value { color: #111827; }
    .fin-box.paid .fin-value { color: #047857; }
    .fin-box.remaining .fin-value { color: #b91c1c; }
    .fin-box.deposit .fin-value { color: #c2410c; }

    /* الأصناف */
    .booking-items {
      font-size: 11.5px;
      color: var(--text-muted);
      padding: 6px 10px;
      background: var(--surface-muted, #f9fafb);
      border-radius: 8px;
      margin-bottom: 8px;
      line-height: 1.7;
    }
    .booking-items strong { color: var(--text-secondary); font-weight: 700; }

    /* الأزرار */
    .booking-actions {
      display: flex;
      gap: 6px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .booking-actions .btn-action {
      flex: 1;
      min-height: 38px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: .15s;
    }
    .btn-action.primary {
      background: #1f2937;
      color: #fff;
    }
    .btn-action.primary:hover { background: #111827; }

    .btn-action.secondary {
      background: var(--surface-muted, #f3f4f6);
      color: var(--text-secondary);
    }
    .btn-action.secondary:hover { background: #e5e7eb; }

    .btn-action.danger {
      flex: 0 0 42px;
      background: #fee2e2;
      color: #dc2626;
    }
    .btn-action.danger:hover { background: #dc2626; color: #fff; }

    .btn-action.success {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }
    .btn-action.success:hover { background: #047857; color: #fff; }

    .btn-action.warning {
      background: #fffbeb;
      color: #b45309;
      border: 1px solid #fcd34d;
    }
    .btn-action.warning:hover { background: #b45309; color: #fff; }

    /* شارة الحجز المكتمل */
    .booking-locked {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #047857;
      border-radius: 10px;
      padding: 8px 12px;
      text-align: center;
      font-size: 11.5px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    /* ===================== الحالات الخاصة ===================== */
    .bookings-empty, .bookings-loading, .bookings-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 200px;
      padding: 32px 20px;
      background: var(--surface-card, #fff);
      border-radius: 14px;
      text-align: center;
      color: var(--text-muted);
    }
    .bookings-empty { border: 2px dashed var(--border); }
    .bookings-empty i { font-size: 36px; opacity: 0.35; }
    .bookings-empty h4 { font-size: 16px; font-weight: 800; color: var(--text); margin: 0; }
    .bookings-empty p { font-size: 13px; margin: 0; }

    .bookings-error {
      border: 1px solid var(--danger);
      color: var(--danger);
    }

    /* ===================== النوافذ ===================== */
    .modal-x {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-x.active { display: flex; }

    .modal-x-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.5);
      backdrop-filter: blur(2px);
    }
    .modal-x-dialog {
      position: relative;
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }
    .modal-x-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .modal-x-header h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
    }
    .modal-x-close {
      width: 32px;
      height: 32px;
      border: 0;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 8px;
      font-size: 16px;
    }
    .modal-x-close:hover { background: var(--surface-muted, #f3f4f6); }

    .modal-x-body { padding: 16px; }

    .modal-x-footer {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
    }
    .modal-x-footer button {
      flex: 1;
      min-height: 44px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
    }
    .modal-x-footer .btn-cancel {
      background: var(--surface-muted, #f3f4f6);
      color: var(--text-secondary);
    }
    .modal-x-footer .btn-confirm {
      background: var(--primary);
      color: #fff;
    }
    .modal-x-footer .btn-confirm:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* خيارات الحالة */
    .status-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .status-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      color: var(--text-secondary);
      transition: .15s;
    }
    .status-option:hover { border-color: var(--primary); }
    .status-option:has(input:checked) {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
    }
    .status-option input { display: none; }

    /* قسم الدفع (يظهر عند اختيار "مكتمل") */
    .payment-section-x {
      display: none;
      padding: 12px;
      background: #fffbeb;
      border: 1px solid #fcd34d;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .payment-section-x.show { display: block; }
    .payment-section-x .title {
      font-size: 12px;
      font-weight: 800;
      color: #92400e;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .payment-section-x .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .payment-section-x .row:last-child { margin-bottom: 0; }
    .payment-section-x .row label {
      font-size: 12px;
      font-weight: 700;
      color: #92400e;
      width: 85px;
      flex-shrink: 0;
    }
    .payment-section-x .row input,
    .payment-section-x .row select {
      flex: 1;
      height: 42px;
      padding: 0 10px;
      border: 1px solid #fcd34d;
      border-radius: 10px;
      background: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      color: #92400e;
    }
    .payment-section-x .row select {
      text-align: right;
      font-weight: 700;
    }
    .payment-section-x .hint {
      font-size: 11px;
      color: #92400e;
      text-align: center;
      margin-top: 6px;
      opacity: .85;
    }

    /* ===================== التجاوب ===================== */
    @media (min-width: 1024px) {
      .bookings-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
    }

    @media (max-width: 480px) {
      .booking-card { padding: 12px; }
      .booking-name { font-size: 14px; }
      .booking-finance { grid-template-columns: repeat(4, 1fr); gap: 4px; }
      .fin-box { padding: 6px 2px; }
      .fin-label { font-size: 9px; }
      .fin-value { font-size: 11.5px; }
      .btn-action { font-size: 11px; min-height: 36px; }
    }
  </style>
</head>

<body>

  <div id="loadingScreen" class="loading-screen">
    <div class="loading-content">
      <div class="loading-logo"><i class="fas fa-utensils"></i></div>
      <h1 class="loading-title">شواطئ عدن</h1>
      <p class="loading-subtitle">مطابخ ومطاعم</p>
      <div class="loading-dots"><span></span><span></span><span></span></div>
    </div>
  </div>

  <div class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <div class="main-area">
      <header id="header" class="header"></header>

      <main class="content" id="pageContent">

        <div class="page-header">
          <div>
            <h1 class="page-title">📋 الحجوزات</h1>
            <p class="page-subtitle">إدارة حجوزات المناسبات والفواتير</p>
          </div>
          <a href="booking-form.html" class="btn btn-primary btn-sm">
            <i class="fas fa-plus"></i>
            <span>حجز جديد</span>
          </a>
        </div>

        <div class="bookings-toolbar">
          <div class="bookings-search">
            <i class="fas fa-search search-icon"></i>
            <input type="search" id="bookingSearch" class="search-input"
                   placeholder="ابحث باسم العميل، الهاتف، أو رقم الحجز..." autocomplete="off">
          </div>

          <div class="filter-chips" id="filterChips">
            <button type="button" class="filter-chip active" data-filter="all">
              <span>الكل</span><span class="chip-count">0</span>
            </button>
            <button type="button" class="filter-chip" data-filter="new">
              <span>جديد</span><span class="chip-count">0</span>
            </button>
            <button type="button" class="filter-chip" data-filter="confirmed">
              <span>مؤكد</span><span class="chip-count">0</span>
            </button>
            <button type="button" class="filter-chip" data-filter="completed">
              <span>مكتمل</span><span class="chip-count">0</span>
            </button>
            <button type="button" class="filter-chip" data-filter="cancelled">
              <span>ملغي</span><span class="chip-count">0</span>
            </button>
          </div>
        </div>

        <div class="bookings-summary">
          <div class="summary-box">
            <div class="summary-label">إجمالي الحجوزات</div>
            <div class="summary-value" id="totalBookings">0</div>
          </div>
          <div class="summary-box">
            <div class="summary-label">حجوزات اليوم</div>
            <div class="summary-value" id="todayBookings">0</div>
          </div>
          <div class="summary-box">
            <div class="summary-label">إجمالي القيمة</div>
            <div class="summary-value" id="totalAmount">0</div>
          </div>
        </div>

        <div id="bookingList" class="bookings-list">
          <div class="bookings-loading">
            <i class="fas fa-spinner fa-spin"></i>
            <span>جاري تحميل الحجوزات...</span>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- ===================== Modal تغيير الحالة ===================== -->
  <div class="modal-x" id="statusModal">
    <div class="modal-x-overlay" data-close="statusModal"></div>
    <div class="modal-x-dialog">
      <div class="modal-x-header">
        <h3 id="statusModalTitle">تغيير حالة الحجز</h3>
        <button type="button" class="modal-x-close" data-close="statusModal">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div class="modal-x-body">

        <div class="status-options" id="statusOptions">
          <label class="status-option">
            <input type="radio" name="newStatus" value="new">
            <i class="fas fa-circle" style="color:#f59e0b;font-size:8px"></i>
            جديد
          </label>
          <label class="status-option">
            <input type="radio" name="newStatus" value="confirmed">
            <i class="fas fa-circle" style="color:#10b981;font-size:8px"></i>
            مؤكد
          </label>
          <label class="status-option">
            <input type="radio" name="newStatus" value="completed">
            <i class="fas fa-circle" style="color:#6366f1;font-size:8px"></i>
            مكتمل
          </label>
          <label class="status-option">
            <input type="radio" name="newStatus" value="cancelled">
            <i class="fas fa-circle" style="color:#ef4444;font-size:8px"></i>
            ملغي
          </label>
        </div>

        <div class="payment-section-x" id="paymentSectionX">
          <div class="title">
            <i class="fas fa-money-bill-wave"></i>
            تسجيل دفعة الإكمال
          </div>

          <div class="row">
            <label for="paymentAmountX">المبلغ المتبقي</label>
            <input type="number" id="paymentAmountX" min="0" step="0.01" placeholder="0">
          </div>

          <div class="row">
            <label for="paymentMethodX">طريقة الدفع</label>
            <select id="paymentMethodX">
              <!-- يملأها JS -->
            </select>
          </div>

          <div class="hint" id="paymentHintX">
            سيتم تسجيل هذا المبلغ كدفعة مرتبطة بالحجز.
          </div>
        </div>

      </div>

      <div class="modal-x-footer">
        <button type="button" class="btn-cancel" data-close="statusModal">إلغاء</button>
        <button type="button" class="btn-confirm" id="confirmStatusBtn">تأكيد</button>
      </div>
    </div>
  </div>

  <nav id="bottomNav" class="bottom-nav"></nav>
  <button id="fab" class="fab" type="button" aria-label="حجز جديد"
          onclick="window.location.href='booking-form.html'">
    <i class="fas fa-plus"></i>
  </button>

  <div id="modalContainer"></div>
  <div id="toastContainer" class="toast-container"></div>

  <script src="assets/js/core/utils.js"></script>
  <script src="assets/js/core/api.js"></script>
  <script src="assets/js/components/layout.js"></script>
  <script src="assets/js/pages/bookings.js"></script>

</body>
</html>
