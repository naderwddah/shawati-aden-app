<!doctype html>
<html dir="rtl" lang="ar" data-page="menu-items">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#8F1720" />
    <meta name="description" content="إدارة المنيو الإلكتروني - شواطئ عدن" />
    <title>المنيو الإلكتروني - شواطئ عدن</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/css/global.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="assets/images/logo.png" />

    <style>
      /* ===== تنسيقات خاصة بصفحة المنيو ===== */
      .menu-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px;
        margin-top: 12px;
      }

      .menu-card {
        background: var(--surface-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        overflow: hidden;
        transition: all 0.2s ease;
        box-shadow: var(--shadow-sm);
        position: relative;
      }
      .menu-card:hover {
        box-shadow: var(--shadow-md);
        transform: translateY(-2px);
      }

      .menu-card .image-wrap {
        height: 130px;
        background: var(--surface-soft);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }
      .menu-card .image-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .menu-card .image-wrap .no-image {
        color: var(--text-muted);
        font-size: 32px;
        opacity: 0.3;
      }

      .menu-card .info {
        padding: 8px 10px 10px;
      }
      .menu-card .info .name {
        font-weight: 800;
        font-size: 14px;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .menu-card .info .category {
        font-size: 11px;
        color: var(--text-muted);
        background: var(--surface);
        display: inline-block;
        padding: 0 8px;
        border-radius: var(--radius-full);
        margin-top: 2px;
      }
      .menu-card .info .price {
        font-weight: 800;
        color: var(--primary);
        font-size: 14px;
        margin-top: 2px;
      }

      .menu-card .actions {
        display: flex;
        gap: 4px;
        padding: 4px 8px 8px;
        border-top: 1px solid var(--border);
        justify-content: flex-end;
      }
      .menu-card .actions button {
        padding: 4px 10px;
        font-size: 12px;
        border-radius: var(--radius-sm);
        border: none;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
      }
      .menu-card .actions .btn-edit {
        background: var(--primary-soft);
        color: var(--primary);
      }
      .menu-card .actions .btn-edit:hover {
        background: var(--primary);
        color: #fff;
      }
      .menu-card .actions .btn-delete {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .menu-card .actions .btn-delete:hover {
        background: var(--danger);
        color: #fff;
      }

      /* ===== نموذج الإضافة / التعديل ===== */
      .form-grid-3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
      }
      .form-grid-3 .form-group {
        margin-bottom: 0;
      }

      .image-upload-wrap {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 4px;
      }
      .image-upload-wrap .preview-box {
        width: 60px;
        height: 60px;
        border-radius: var(--radius-sm);
        border: 2px dashed var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        flex-shrink: 0;
        background: var(--surface);
      }
      .image-upload-wrap .preview-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .image-upload-wrap .preview-box .placeholder-icon {
        color: var(--text-muted);
        font-size: 24px;
        opacity: 0.4;
      }
      .image-upload-wrap .upload-btn {
        background: var(--primary-soft);
        color: var(--primary);
        padding: 6px 14px;
        border-radius: var(--radius-sm);
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        transition: 0.2s;
        border: 1px solid var(--border);
      }
      .image-upload-wrap .upload-btn:hover {
        background: var(--primary);
        color: #fff;
      }
      .image-upload-wrap input[type="file"] {
        display: none;
      }

      @media (max-width: 640px) {
        .menu-grid {
          grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
          gap: 8px;
        }
        .menu-card .image-wrap {
          height: 100px;
        }
        .form-grid-3 {
          grid-template-columns: 1fr 1fr;
        }
        .form-grid-3 .form-group:last-child {
          grid-column: 1 / 3;
        }
      }
      @media (max-width: 480px) {
        .menu-grid {
          grid-template-columns: 1fr 1fr;
        }
        .form-grid-3 {
          grid-template-columns: 1fr;
        }
        .form-grid-3 .form-group:last-child {
          grid-column: 1;
        }
        .image-upload-wrap {
          flex-wrap: wrap;
        }
      }

      /* ===== فارغ ===== */
      .empty-state-custom {
        grid-column: 1 / -1;
        text-align: center;
        padding: 40px 20px;
        color: var(--text-muted);
      }
      .empty-state-custom i {
        font-size: 48px;
        opacity: 0.2;
        display: block;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <!-- ===== شاشة التحميل ===== -->
    <div id="loadingScreen" class="loading-screen">
      <div class="loading-content">
        <div class="loading-logo"><i class="fas fa-utensils"></i></div>
        <h1 class="loading-title">شواطئ عدن</h1>
        <p class="loading-subtitle">مطابخ ومطاعم</p>
        <div class="loading-dots"><span></span><span></span><span></span></div>
      </div>
    </div>

    <!-- ===== التطبيق ===== -->
    <div class="app">
      <aside id="sidebar" class="sidebar"></aside>
      <div id="sidebarOverlay" class="sidebar-overlay"></div>
      <div class="main-area">
        <header id="header" class="header"></header>

        <main class="content" id="pageContent">
          <div class="page-header" style="margin-bottom: 12px;">
            <div>
              <h1 class="page-title" style="font-size: 20px;">🍽️ المنيو الإلكتروني</h1>
              <p class="page-subtitle" style="font-size: 12px;">إدارة الأكلات والصور والتصنيفات</p>
            </div>
          </div>

          <!-- ===== نموذج الإضافة / التعديل ===== -->
          <div class="card" style="margin-bottom: 16px; padding: 14px 16px;">
            <form id="itemForm">
              <input type="hidden" id="editId" value="" />

              <div class="form-grid-3">
                <div class="form-group">
                  <label class="form-label" style="font-size: 12px; margin-bottom: 2px;">اسم الصنف <span class="req">*</span></label>
                  <input type="text" class="form-input" id="itemName" placeholder="مثال: شاورما دجاج" style="height: 38px; font-size: 13px;" required />
                </div>
                <div class="form-group">
                  <label class="form-label" style="font-size: 12px; margin-bottom: 2px;">السعر (ر.س) <span class="req">*</span></label>
                  <input type="number" class="form-input" id="itemPrice" placeholder="0.00" min="0" step="0.5" style="height: 38px; font-size: 13px;" required />
                </div>
                <div class="form-group">
                  <label class="form-label" style="font-size: 12px; margin-bottom: 2px;">التصنيف</label>
                  <select class="form-select" id="itemCategory" style="height: 38px; font-size: 13px;">
                    <option value="مشاوي">مشاوي</option>
                    <option value="سلطات">سلطات</option>
                    <option value="مقبلات">مقبلات</option>
                    <option value="مشروبات">مشروبات</option>
                    <option value="حلويات">حلويات</option>
                    <option value="أطباق رئيسية">أطباق رئيسية</option>
                    <option value="أخرى">أخرى</option>
                  </select>
                </div>
              </div>

              <!-- رفع الصورة -->
              <div class="form-group" style="margin-top: 8px; margin-bottom: 0;">
                <label class="form-label" style="font-size: 12px; margin-bottom: 2px;">صورة الصنف</label>
                <div class="image-upload-wrap">
                  <div class="preview-box" id="imagePreviewBox">
                    <i class="fas fa-image placeholder-icon" id="placeholderIcon"></i>
                    <img id="imagePreview" src="" alt="معاينة" style="display: none;" />
                  </div>
                  <label class="upload-btn" for="imageInput">
                    <i class="fas fa-upload"></i> اختر صورة
                  </label>
                  <input type="file" id="imageInput" accept="image/*" />
                  <button type="button" id="removeImageBtn" style="display: none; background: var(--danger-soft); color: var(--danger); border: none; padding: 4px 10px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 700; cursor: pointer;">حذف</button>
                </div>
              </div>

              <div style="display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end;">
                <button type="reset" class="btn btn-secondary" style="height: 36px; font-size: 13px; padding: 0 16px;">إلغاء</button>
                <button type="submit" class="btn btn-primary" id="submitBtn" style="height: 36px; font-size: 13px; padding: 0 20px;">
                  <i class="fas fa-save"></i> حفظ الصنف
                </button>
              </div>
            </form>
          </div>

          <!-- ===== قائمة الأصناف (بطاقات) ===== -->
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <h3 style="font-size: 15px; font-weight: 800; color: var(--text);">
              <i class="fas fa-utensils" style="color: var(--primary);"></i> قائمة الأكلات
              <span id="itemsCount" style="font-size: 13px; color: var(--text-muted); font-weight: 400;">(0)</span>
            </h3>
            <span style="font-size: 12px; color: var(--text-muted);">🖼️ معاينة الصور</span>
          </div>

          <div id="itemsGrid" class="menu-grid">
            <div class="empty-state-custom">
              <i class="fas fa-utensils"></i>
              <p>لا توجد أكلات مضافة بعد</p>
              <p style="font-size: 13px;">أضف صنفاً جديداً باستخدام النموذج أعلاه</p>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- ===== المكونات العامة ===== -->
    <nav id="bottomNav" class="bottom-nav"></nav>
    <button id="fab" class="fab" aria-label="إضافة صنف" onclick="document.getElementById('itemForm').scrollIntoView({behavior:'smooth'});"><i class="fas fa-plus"></i></button>
    <div id="modalContainer"></div>
    <div id="toastContainer" class="toast-container"></div>

    <!-- ===== السكريبتات ===== -->
    <script src="assets/js/core/utils.js"></script>
    <script src="assets/js/core/state.js"></script>
    <script src="assets/js/core/api.js"></script>
    <script src="assets/js/components/layout.js"></script>

    <script>
      (function() {
        'use strict';

        // ============================================================
        // 1. إدارة البيانات في localStorage (لحفظ الصور)
        // ============================================================
        const STORAGE_KEY = 'shawati_menu_items';

        function getItems() {
          const data = localStorage.getItem(STORAGE_KEY);
          return data ? JSON.parse(data) : [];
        }

        function saveItems(items) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        }

        // ============================================================
        // 2. عناصر DOM
        // ============================================================
        const form = document.getElementById('itemForm');
        const editId = document.getElementById('editId');
        const nameInput = document.getElementById('itemName');
        const priceInput = document.getElementById('itemPrice');
        const categorySelect = document.getElementById('itemCategory');
        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const placeholderIcon = document.getElementById('placeholderIcon');
        const removeImageBtn = document.getElementById('removeImageBtn');
        const submitBtn = document.getElementById('submitBtn');
        const grid = document.getElementById('itemsGrid');
        const countSpan = document.getElementById('itemsCount');

        let currentImageData = null; // base64 string

        // ============================================================
        // 3. معاينة الصورة
        // ============================================================
        imageInput.addEventListener('change', function(e) {
          const file = e.target.files[0];
          if (!file) return;
          if (file.size > 2 * 1024 * 1024) {
            showToast('حجم الصورة كبير جداً (الحد الأقصى 2MB)', 'warning');
            this.value = '';
            return;
          }
          const reader = new FileReader();
          reader.onload = function(ev) {
            currentImageData = ev.target.result;
            imagePreview.src = currentImageData;
            imagePreview.style.display = 'block';
            placeholderIcon.style.display = 'none';
            removeImageBtn.style.display = 'inline-block';
          };
          reader.readAsDataURL(file);
        });

        removeImageBtn.addEventListener('click', function() {
          currentImageData = null;
          imagePreview.src = '';
          imagePreview.style.display = 'none';
          placeholderIcon.style.display = 'block';
          removeImageBtn.style.display = 'none';
          imageInput.value = '';
        });

        function setImagePreview(src) {
          if (src) {
            currentImageData = src;
            imagePreview.src = src;
            imagePreview.style.display = 'block';
            placeholderIcon.style.display = 'none';
            removeImageBtn.style.display = 'inline-block';
          } else {
            currentImageData = null;
            imagePreview.src = '';
            imagePreview.style.display = 'none';
            placeholderIcon.style.display = 'block';
            removeImageBtn.style.display = 'none';
          }
        }

        // ============================================================
        // 4. عرض الأصناف (بطاقات)
        // ============================================================
        function renderItems() {
          const items = getItems();
          countSpan.textContent = `(${items.length})`;

          if (items.length === 0) {
            grid.innerHTML = `
              <div class="empty-state-custom">
                <i class="fas fa-utensils"></i>
                <p>لا توجد أكلات مضافة بعد</p>
                <p style="font-size: 13px;">أضف صنفاً جديداً باستخدام النموذج أعلاه</p>
              </div>
            `;
            return;
          }

          let html = '';
          items.forEach(item => {
            const imgHtml = item.image ?
              `<img src="${item.image}" alt="${item.name}" />` :
              `<i class="fas fa-image no-image"></i>`;
            html += `
              <div class="menu-card" data-id="${item.id}">
                <div class="image-wrap">
                  ${imgHtml}
                </div>
                <div class="info">
                  <div class="name">${item.name}</div>
                  <span class="category">${item.category || 'عام'}</span>
                  <div class="price">${parseFloat(item.price).toFixed(2)} ر.س</div>
                </div>
                <div class="actions">
                  <button class="btn-edit" onclick="editMenuItem('${item.id}')"><i class="fas fa-pen"></i> تعديل</button>
                  <button class="btn-delete" onclick="deleteMenuItem('${item.id}')"><i class="fas fa-trash"></i> حذف</button>
                </div>
              </div>
            `;
          });
          grid.innerHTML = html;
        }

        // ============================================================
        // 5. دوال التعديل والحذف (Global)
        // ============================================================
        window.editMenuItem = function(id) {
          const items = getItems();
          const item = items.find(i => i.id == id);
          if (!item) return showToast('الصنف غير موجود', 'error');

          editId.value = id;
          nameInput.value = item.name;
          priceInput.value = item.price;
          categorySelect.value = item.category || 'أخرى';
          setImagePreview(item.image || null);
          submitBtn.innerHTML = '<i class="fas fa-edit"></i> تحديث الصنف';
          form.scrollIntoView({ behavior: 'smooth', block: 'center' });
        };

        window.deleteMenuItem = function(id) {
          if (!confirm('هل أنت متأكد من حذف هذا الصنف؟')) return;
          let items = getItems();
          items = items.filter(i => i.id != id);
          saveItems(items);
          renderItems();
          showToast('تم حذف الصنف بنجاح', 'success');
        };

        // ============================================================
        // 6. حفظ (إضافة / تحديث)
        // ============================================================
        form.addEventListener('submit', function(e) {
          e.preventDefault();

          const name = nameInput.value.trim();
          const price = parseFloat(priceInput.value);
          const category = categorySelect.value;
          const image = currentImageData;

          if (!name) return showToast('يرجى إدخال اسم الصنف', 'warning');
          if (!price || price <= 0) return showToast('يرجى إدخال سعر صحيح', 'warning');

          const items = getItems();
          const editIdVal = editId.value;

          if (editIdVal) {
            // تحديث
            const index = items.findIndex(i => i.id == editIdVal);
            if (index === -1) return showToast('الصنف غير موجود', 'error');
            items[index] = {
              ...items[index],
              name: name,
              price: price,
              category: category,
              image: image || items[index].image || null
            };
            showToast('✅ تم تحديث الصنف بنجاح', 'success');
            submitBtn.innerHTML = '<i class="fas fa-save"></i> حفظ الصنف';
          } else {
            // إضافة جديدة
            const newItem = {
              id: Date.now().toString(),
              name: name,
              price: price,
              category: category,
              image: image || null
            };
            items.push(newItem);
            showToast('✅ تم إضافة الصنف بنجاح', 'success');
          }

          saveItems(items);
          renderItems();

          // إعادة تعيين النموذج
          form.reset();
          editId.value = '';
          setImagePreview(null);
          imageInput.value = '';
          submitBtn.innerHTML = '<i class="fas fa-save"></i> حفظ الصنف';
          nameInput.focus();
        });

        // ============================================================
        // 7. تهيئة
        // ============================================================
        function init() {
          renderItems();

          // إعادة تعيين النموذج عند الضغط على إلغاء
          form.querySelector('button[type="reset"]').addEventListener('click', function() {
            editId.value = '';
            setImagePreview(null);
            imageInput.value = '';
            submitBtn.innerHTML = '<i class="fas fa-save"></i> حفظ الصنف';
          });
        }

        // تشغيل عند تحميل الصفحة
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', init);
        } else {
          init();
        }

        // جعل الدوال متاحة عالمياً للـ onclick
        window.editMenuItem = editMenuItem;
        window.deleteMenuItem = deleteMenuItem;

      })();
    </script>
  </body>
</html>
