<!doctype html>
<html dir="rtl" lang="ar" data-page="items">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#8F1720" />
    <meta name="description" content="إدارة الأصناف - شواطئ عدن" />
    <title>الأصناف - شواطئ عدن</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="assets/css/global.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="assets/images/logo.png" />
    <style>
      .items-summary {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: var(--space-4);
        padding: 12px;
        background: var(--surface-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-sm);
      }
      .summary-item { text-align: center; }
      .summary-label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
      .summary-value { font-size: 18px; font-weight: 800; color: var(--text); }

      .item-card {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        background: var(--surface-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 14px 16px;
        margin-bottom: var(--space-2);
        box-shadow: var(--shadow-sm);
        transition: all 0.15s ease;
      }
      .item-card:last-child { margin-bottom: 0; }
      .item-card .icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border-radius: var(--radius-sm);
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 18px;
        flex-shrink: 0;
      }
      .item-card .info { flex: 1; min-width: 0; }
      .item-card .info .name { font-size: 15px; font-weight: 700; color: var(--text); }
      .item-card .info .details {
        font-size: 13px;
        color: var(--text-secondary);
        display: flex;
        gap: var(--space-3);
        flex-wrap: wrap;
        margin-top: 2px;
      }
      .item-card .info .details .unit { color: var(--text-muted); }
      .item-card .info .details .price { font-weight: 700; color: var(--primary); }
      .item-card .actions {
        display: flex;
        gap: var(--space-1);
        flex-shrink: 0;
      }

      .empty-state { text-align: center; padding: var(--space-8) var(--space-4); color: var(--text-muted); }
      .empty-state i { font-size: 36px; opacity: 0.3; margin-bottom: var(--space-3); display: block; }
      .empty-state h4 { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: var(--space-1); }
      .empty-state p { font-size: 14px; }

      .page-header .btn-sm { display: none; }

      @media (max-width: 767px) {
        .items-summary { grid-template-columns: repeat(3, 1fr); padding: 10px; gap: 6px; }
        .summary-value { font-size: 16px; }
        .item-card { padding: 12px 14px; flex-wrap: wrap; }
        .item-card .icon { width: 38px; height: 38px; font-size: 15px; }
        .item-card .info .name { font-size: 14px; }
        .item-card .info .details { font-size: 12px; gap: var(--space-2); }
        .item-card .actions { margin-right: auto; }
      }
      @media (min-width: 768px) {
        .page-header .btn-sm { display: inline-flex; }
        .items-summary { padding: 16px 20px; }
        .summary-value { font-size: 22px; }
        .item-card { padding: 16px 20px; }
        .item-card .icon { width: 50px; height: 50px; font-size: 20px; }
        .item-card .info .name { font-size: 17px; }
      }
      @media (min-width: 1024px) {
        #itemsList { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
        .item-card { margin-bottom: 0; }
      }

      .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
      @media (max-width: 600px) { .form-grid-2 { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="loadingScreen" class="loading-screen">
      <div class="loading-content">
        <div class="loading-logo"><i class="fas fa-utensils"></i></div>
        <h1 class="loading-title">شواطئ عدن</h1>
        <p class="loading-subtitle">مطابخ ومطاعم</p>
        <div class="loading-dots"><span></span><span></span><span></span></div>
      </div>
    </div>

    <div class="app">
      <aside id="sidebar" class="sidebar"></aside>
      <div id="sidebarOverlay" class="sidebar-overlay"></div>
      <div class="main-area">
        <header id="header" class="header"></header>
        <main class="content" id="pageContent">
          <div class="page-header">
            <button class="btn btn-primary btn-sm" id="addItemBtn">
              <i class="fas fa-plus"></i> <span>صنف جديد</span>
            </button>
          </div>

          <div class="items-summary">
            <div class="summary-item">
              <span class="summary-label">إجمالي الأصناف</span>
              <span class="summary-value" id="itemsCount">0</span>
            </div>
            <div class="summary-item">
              <span class="summary-label">أقل سعر</span>
              <span class="summary-value" id="minPrice">0 ر.س</span>
            </div>
            <div class="summary-item">
              <span class="summary-label">أعلى سعر</span>
              <span class="summary-value" id="maxPrice">0 ر.س</span>
            </div>
          </div>

          <div class="search-bar">
            <i class="fas fa-search search-icon"></i>
            <input type="text" class="search-input" id="itemSearch" placeholder="ابحث عن صنف بالاسم" />
          </div>

          <div id="itemsList"></div>
        </main>
      </div>
    </div>

    <nav id="bottomNav" class="bottom-nav"></nav>
    <button id="fab" class="fab" aria-label="إضافة صنف"><i class="fas fa-plus"></i></button>
    <div id="modalContainer"></div>
    <div id="toastContainer" class="toast-container"></div>

<!-- مودال إضافة / تعديل صنف (مبسط) -->
<div class="modal" id="itemModal" role="dialog" aria-modal="true">
  <div class="modal-overlay" data-close="itemModal"></div>
  <div class="modal-dialog">
    <div class="modal-header">
      <h3 class="modal-title" id="itemModalTitle">إضافة صنف جديد</h3>
      <button class="modal-close" data-close="itemModal" aria-label="إغلاق"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label" for="itemName">اسم الصنف <span class="req">*</span></label>
        <input type="text" class="form-input" id="itemName" placeholder="مثال: دجاج مشوي" />
      </div>
      <div class="form-group">
        <label class="form-label" for="itemPrice">السعر (ريال) <span class="req">*</span></label>
        <input type="number" class="form-input" id="itemPrice" placeholder="0.00" min="0" step="0.01" inputmode="decimal" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-close="itemModal">إلغاء</button>
      <button class="btn btn-primary" id="saveItemBtn">حفظ الصنف</button>
    </div>
  </div>
</div>

    <script src="assets/js/core/utils.js"></script>
    <script src="assets/js/core/api.js"></script>
    <script src="assets/js/components/layout.js"></script>
    <script src="assets/js/pages/items.js"></script>
  </body>
</html>
