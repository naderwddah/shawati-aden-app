<!doctype html>
<html lang="ar" dir="rtl" data-page="items">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    >

    <meta name="theme-color" content="#8F1720">
    <meta
        name="description"
        content="إدارة أصناف مطبخ الولائم"
    >

    <title>الأصناف - مطبخ الولائم</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css"
    >

    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="assets/images/logo.png">

    <style>
        .items-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }

        .items-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .summary-item {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            padding: 14px;
            text-align: center;
        }

        .summary-label {
            display: block;
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 4px;
        }

        .summary-value {
            display: block;
            color: var(--text);
            font-size: 20px;
            font-weight: 800;
        }

        .items-list {
            min-height: 100px;
        }

        .item-card {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 15px;
            box-shadow: var(--shadow-sm);
            transition: transform .15s ease, box-shadow .15s ease;
        }

        .item-card:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .item-icon {
            width: 46px;
            height: 46px;
            flex: 0 0 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            background: var(--primary-soft);
            color: var(--primary);
            font-size: 18px;
        }

        .item-info {
            flex: 1;
            min-width: 0;
        }

        .item-name {
            color: var(--text);
            font-size: 15px;
            font-weight: 800;
            overflow-wrap: anywhere;
        }

        .item-details {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 14px;
            margin-top: 5px;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .item-price {
            color: var(--primary);
            font-weight: 800;
        }

        .item-note {
            color: var(--text-muted);
            overflow-wrap: anywhere;
        }

        .item-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .item-actions button {
            width: 36px;
            height: 36px;
        }

        #itemsList {
            display: grid;
            gap: 10px;
        }

        .items-empty {
            background: var(--surface-card);
            border: 1px dashed var(--border);
            border-radius: var(--radius-md);
            padding: 48px 20px;
            text-align: center;
        }

        .items-empty-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--primary-soft);
            color: var(--primary);
            font-size: 28px;
        }

        .items-empty-title {
            color: var(--text);
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .items-empty-text {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 18px;
        }

        .items-loading {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 35px;
            text-align: center;
            color: var(--text-muted);
        }

        .items-loading i {
            margin-left: 8px;
        }

        .form-note {
            width: 100%;
            min-height: 90px;
            resize: vertical;
        }

        .required {
            color: var(--danger);
        }

        @media (max-width: 767px) {
            .items-toolbar {
                align-items: stretch;
            }

            .items-toolbar .btn {
                flex: 0 0 auto;
            }

            .items-summary {
                gap: 6px;
            }

            .summary-item {
                padding: 10px 6px;
            }

            .summary-label {
                font-size: 10px;
            }

            .summary-value {
                font-size: 16px;
            }

            .item-card {
                padding: 12px;
                align-items: flex-start;
            }

            .item-icon {
                width: 40px;
                height: 40px;
                flex-basis: 40px;
                font-size: 15px;
            }

            .item-actions {
                align-self: center;
            }
        }

        @media (min-width: 768px) {
            .items-toolbar .btn {
                display: inline-flex;
            }

            #itemsList {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 600px) {
            .form-grid-2 {
                grid-template-columns: 1fr !important;
            }
        }

        .form-grid-2 {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .full-width {
            grid-column: 1 / -1;
        }
    </style>
</head>

<body>

<div id="loadingScreen" class="loading-screen">
    <div class="loading-content">
        <div class="loading-logo">
            <i class="fas fa-utensils"></i>
        </div>

        <h1 class="loading-title">مطبخ الولائم</h1>

        <p class="loading-subtitle">
            نظام إدارة الولائم
        </p>

        <div class="loading-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
</div>

<div class="app">

    <aside id="sidebar" class="sidebar"></aside>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <div class="main-area">

        <header id="header" class="header"></header>

        <main class="content" id="pageContent">

            <div class="page-header">

                <div>
                    <h1>الأصناف</h1>
                    <p>إدارة الأصناف والأسعار المستخدمة في الحجوزات</p>
                </div>

                <button
                    type="button"
                    class="btn btn-primary btn-sm"
                    id="addItemBtn"
                >
                    <i class="fas fa-plus"></i>
                    <span>صنف جديد</span>
                </button>

            </div>

            <div class="items-summary">

                <div class="summary-item">
                    <span class="summary-label">
                        إجمالي الأصناف
                    </span>

                    <span
                        class="summary-value"
                        id="itemsCount"
                    >
                        0
                    </span>
                </div>

                <div class="summary-item">
                    <span class="summary-label">
                        أقل سعر
                    </span>

                    <span
                        class="summary-value"
                        id="minPrice"
                    >
                        0 ر.س
                    </span>
                </div>

                <div class="summary-item">
                    <span class="summary-label">
                        أعلى سعر
                    </span>

                    <span
                        class="summary-value"
                        id="maxPrice"
                    >
                        0 ر.س
                    </span>
                </div>

            </div>

            <div class="items-toolbar">

                <div class="search-bar" style="flex:1;">
                    <i class="fas fa-search search-icon"></i>

                    <input
                        type="search"
                        class="search-input"
                        id="itemSearch"
                        placeholder="ابحث عن صنف..."
                        autocomplete="off"
                    >
                </div>

            </div>

            <div id="itemsList" class="items-list"></div>

        </main>

    </div>

</div>

<nav id="bottomNav" class="bottom-nav"></nav>

<button
    type="button"
    id="fab"
    class="fab"
    aria-label="إضافة صنف"
>
    <i class="fas fa-plus"></i>
</button>

<div id="modalContainer"></div>

<div
    id="toastContainer"
    class="toast-container"
></div>

<div
    class="modal"
    id="itemModal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="itemModalTitle"
>

    <div
        class="modal-overlay"
        data-close="itemModal"
    ></div>

    <div class="modal-dialog">

        <div class="modal-header">

            <h3
                class="modal-title"
                id="itemModalTitle"
            >
                إضافة صنف جديد
            </h3>

            <button
                type="button"
                class="modal-close"
                data-close="itemModal"
                aria-label="إغلاق"
            >
                <i class="fas fa-times"></i>
            </button>

        </div>

        <form id="itemForm">

            <div class="modal-body">

                <div class="form-grid-2">

                    <div class="form-group full-width">

                        <label
                            class="form-label"
                            for="itemName"
                        >
                            اسم الصنف
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            class="form-input"
                            id="itemName"
                            maxlength="255"
                            required
                            autocomplete="off"
                            placeholder="مثال: دجاج مشوي"
                        >

                    </div>

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="itemPrice"
                        >
                            السعر الافتراضي
                            <span class="required">*</span>
                        </label>

                        <input
                            type="number"
                            class="form-input"
                            id="itemPrice"
                            min="0"
                            step="0.01"
                            inputmode="decimal"
                            required
                            placeholder="0.00"
                        >

                    </div>

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="itemNote"
                        >
                            الملاحظة
                        </label>

                        <input
                            type="text"
                            class="form-input"
                            id="itemNote"
                            maxlength="255"
                            placeholder="ملاحظة اختيارية"
                        >

                    </div>

                </div>

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-close="itemModal"
                >
                    إلغاء
                </button>

                <button
                    type="submit"
                    class="btn btn-primary"
                    id="saveItemBtn"
                >
                    <i class="fas fa-save"></i>
                    حفظ الصنف
                </button>

            </div>

        </form>

    </div>

</div>

<script src="assets/js/core/utils.js"></script>
<script src="assets/js/core/api.js"></script>
<script src="assets/js/components/layout.js"></script>
<script src="assets/js/pages/items.js"></script>

</body>
</html>
