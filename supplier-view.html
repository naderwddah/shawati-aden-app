<!doctype html>
<html dir="rtl" lang="ar" data-page="supplier-view">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#8F1720" />
    <meta name="description" content="ملف المورد - شواطئ عدن" />
    <title>ملف المورد - شواطئ عدن</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/css/global.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="assets/images/logo.png" />
    <style>
      /* نفس تنسيقات customer-view مع تعديل بسيط */
      .supplier-profile-header {
        display: flex;
        align-items: center;
        gap: var(--space-4);
        padding: var(--space-4);
        background: var(--surface-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        margin-bottom: var(--space-4);
        box-shadow: var(--shadow-sm);
      }
      .supplier-profile-header .avatar {
        width: 56px;
        height: 56px;
        border-radius: var(--radius-md);
        background: var(--primary-soft);
        color: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: 700;
        flex-shrink: 0;
      }
      .supplier-profile-header .info {
        flex: 1;
      }
      .supplier-profile-header .info .name {
        font-size: 18px;
        font-weight: 800;
        color: var(--text);
      }
      .supplier-profile-header .info .phone {
        font-size: 14px;
        color: var(--text-muted);
        direction: ltr;
        text-align: start;
      }
      .supplier-profile-header .info .category {
        font-size: 13px;
        color: var(--text-secondary);
        margin-top: 2px;
      }
      .supplier-profile-header .status-badge {
        flex-shrink: 0;
      }

      .profile-summary {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: var(--space-4);
      }
      .profile-summary .stat {
        background: var(--surface-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 12px;
        text-align: center;
        box-shadow: var(--shadow-sm);
      }
      .profile-summary .stat .label {
        font-size: 11px;
        color: var(--text-muted);
        display: block;
      }
      .profile-summary .stat .value {
        font-size: 18px;
        font-weight: 800;
        color: var(--text);
      }
      .profile-summary .stat .value.danger {
        color: var(--danger);
      }
      .profile-summary .stat .value.success {
        color: var(--success);
      }

      .tabs {
        display: flex;
        gap: var(--space-2);
        border-bottom: 1px solid var(--border);
        margin-bottom: var(--space-4);
        overflow-x: auto;
      }
      .tabs .tab {
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 500;
        color: var(--text-muted);
        cursor: pointer;
        border-bottom: 2px solid transparent;
        transition: all 0.15s ease;
        white-space: nowrap;
      }
      .tabs .tab:hover {
        color: var(--text);
      }
      .tabs .tab.active {
        color: var(--primary);
        border-bottom-color: var(--primary);
      }

      .tab-content {
        display: none;
      }
      .tab-content.active {
        display: block;
      }

      .invoice-item,
      .payment-item {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        padding: 10px 12px;
        background: var(--surface-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        margin-bottom: var(--space-2);
        box-shadow: var(--shadow-sm);
      }
      .invoice-item .info,
      .payment-item .info {
        flex: 1;
      }
      .invoice-item .info .title,
      .payment-item .info .title {
        font-weight: 700;
        color: var(--text);
      }
      .invoice-item .info .sub,
      .payment-item .info .sub {
        font-size: 12px;
        color: var(--text-muted);
      }
      .invoice-item .amount,
      .payment-item .amount {
        font-weight: 700;
        font-size: 14px;
      }
      .invoice-item .amount.positive {
        color: var(--success);
      }
      .invoice-item .amount.negative {
        color: var(--danger);
      }

      .statement-item {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid var(--border);
        font-size: 14px;
      }
      .statement-item:last-child {
        border-bottom: none;
      }
      .statement-item .desc {
        flex: 1;
      }
      .statement-item .debit {
        color: var(--danger);
        font-weight: 700;
        margin-left: 12px;
        min-width: 70px;
        text-align: end;
      }
      .statement-item .credit {
        color: var(--success);
        font-weight: 700;
        margin-left: 12px;
        min-width: 70px;
        text-align: end;
      }
      .statement-item .balance {
        font-weight: 700;
        min-width: 80px;
        text-align: end;
      }

      @media (max-width: 767px) {
        .profile-summary {
          grid-template-columns: 1fr 1fr 1fr;
          gap: 6px;
        }
        .profile-summary .stat {
          padding: 8px;
        }
        .profile-summary .stat .value {
          font-size: 15px;
        }
        .supplier-profile-header .avatar {
          width: 44px;
          height: 44px;
          font-size: 18px;
        }
        .supplier-profile-header .info .name {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div id="loadingScreen" class="loading-screen">...</div>
    <div class="app">
      <aside id="sidebar" class="sidebar"></aside>
      <div id="sidebarOverlay" class="sidebar-overlay"></div>
      <div class="main-area">
        <header id="header" class="header"></header>
        <main class="content" id="pageContent">
          <div id="supplierViewContent">
            <!-- سيتم تعبئتها بواسطة JavaScript -->
          </div>
        </main>
      </div>
    </div>

    <nav id="bottomNav" class="bottom-nav"></nav>
    <button id="fab" class="fab" aria-label="تسديد دفعة">
      <i class="fas fa-plus"></i>
    </button>
    <div id="modalContainer"></div>
    <div id="toastContainer" class="toast-container"></div>

    <div
      class="modal"
      id="supplierTransactionModal"
      role="dialog"
      aria-modal="true"
    >
      <div class="modal-overlay" data-close="supplierTransactionModal"></div>
      <div class="modal-dialog" style="max-width: 780px">
        <div class="modal-header">
          <h3 class="modal-title" id="supplierTransactionModalTitle">
            فاتورة جديدة
          </h3>
          <button
            class="modal-close"
            data-close="supplierTransactionModal"
            aria-label="إغلاق"
          >
            <i class="fas fa-times"></i>
          </button>
        </div>

        <div
          class="switch-group"
          style="
            display: flex;
            gap: 8px;
            padding: 0 20px 12px 20px;
            border-bottom: 1px solid var(--border);
          "
        >
          <button type="button" class="switch-btn active" data-mode="invoice">
            <i class="fas fa-file-invoice"></i> فاتورة جديدة
          </button>
          <button type="button" class="switch-btn" data-mode="payment">
            <i class="fas fa-hand-holding-dollar"></i> تسجيل دفعة
          </button>
        </div>

        <div class="modal-body" style="padding: 20px">
          <div id="supplierInvoiceMode" class="tab-content active">
            <div
              class="section-card"
              style="
                background: var(--surface);
                padding: 12px 16px;
                border-radius: var(--radius-md);
                margin-bottom: 16px;
              "
            >
              <div class="section-title">
                <i class="fas fa-user"></i> بيانات المورد
              </div>
              <div style="display: flex; flex-wrap: wrap; gap: 12px">
                <div>
                  <span style="color: var(--text-muted)">الاسم:</span>
                  <strong id="supplierInvoiceCustomerName">—</strong>
                </div>
                <div>
                  <span style="color: var(--text-muted)">الجوال:</span>
                  <strong id="supplierInvoiceCustomerPhone">—</strong>
                </div>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="supplierInvoiceDate"
                >تاريخ الفاتورة <span class="req">*</span></label
              >
              <input type="date" class="form-input" id="supplierInvoiceDate" />
            </div>
            <div class="form-group">
              <label class="form-label" for="supplierInvoiceTotal"
                >إجمالي الفاتورة <span class="req">*</span></label
              >
              <input
                type="number"
                class="form-input"
                id="supplierInvoiceTotal"
                min="0"
                step="0.01"
              />
            </div>
            <div class="form-group">
              <label class="form-label" for="supplierInvoicePaid"
                >المبلغ المدفوع</label
              >
              <input
                type="number"
                class="form-input"
                id="supplierInvoicePaid"
                min="0"
                step="0.01"
              />
            </div>
            <div class="form-group">
              <label class="form-label" for="supplierInvoiceNotes"
                >ملاحظات</label
              >
              <textarea
                class="form-textarea"
                id="supplierInvoiceNotes"
                rows="3"
                placeholder="ملاحظات الفاتورة"
              ></textarea>
            </div>
          </div>

          <div
            id="supplierPaymentMode"
            class="tab-content"
            style="display: none"
          >
            <div
              class="section-card"
              style="
                background: var(--surface);
                padding: 12px 16px;
                border-radius: var(--radius-md);
                margin-bottom: 16px;
              "
            >
              <div style="display: flex; flex-wrap: wrap; gap: 12px">
                <div>
                  <span style="color: var(--text-muted)">المورد:</span>
                  <strong id="supplierPaymentCustomerName">—</strong>
                </div>
                <div>
                  <span style="color: var(--text-muted)">الجوال:</span>
                  <strong id="supplierPaymentCustomerPhone">—</strong>
                </div>
              </div>
            </div>

            <div
              style="
                background: var(--surface);
                padding: 12px 16px;
                border-radius: var(--radius-md);
                margin-bottom: 16px;
                display: flex;
                justify-content: space-between;
              "
            >
              <span style="color: var(--text-muted)">المستحق الحالي</span>
              <span
                id="supplierPaymentCurrentBalance"
                style="font-weight: 700; color: var(--danger)"
                >0.00 ر.س</span
              >
            </div>

            <div class="form-group">
              <label class="form-label" for="supplierPaymentAmount"
                >المبلغ المدفوع <span class="req">*</span></label
              >
              <input
                type="number"
                class="form-input form-input-lg"
                id="supplierPaymentAmount"
                placeholder="0.00"
                min="0"
                step="0.01"
              />
            </div>

            <div class="form-group">
              <label class="form-label"
                >طريقة الدفع <span class="req">*</span></label
              >
              <div style="display: flex; gap: 12px; flex-wrap: wrap">
                <label class="payment-method-option"
                  ><input
                    type="radio"
                    name="supplierPaymentMethod"
                    value="نقدي"
                    checked
                  /><span>نقدي</span></label
                >
                <label class="payment-method-option"
                  ><input
                    type="radio"
                    name="supplierPaymentMethod"
                    value="تحويل بنكي"
                  /><span>تحويل بنكي</span></label
                >
                <label class="payment-method-option"
                  ><input
                    type="radio"
                    name="supplierPaymentMethod"
                    value="شبكة"
                  /><span>شبكة</span></label
                >
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="supplierPaymentNotes"
                >ملاحظات الدفعة</label
              >
              <textarea
                class="form-textarea"
                id="supplierPaymentNotes"
                rows="2"
                placeholder="ملاحظات (اختياري)"
              ></textarea>
            </div>

            <div
              style="
                background: var(--surface);
                padding: 12px 16px;
                border-radius: var(--radius-md);
                border: 1px solid var(--border);
              "
            >
              <div
                style="
                  display: flex;
                  justify-content: space-between;
                  padding: 4px 0;
                "
              >
                <span style="color: var(--text-muted)">المستحق بعد الدفعة</span>
                <span
                  id="supplierPaymentAfterBalance"
                  style="font-weight: 700; color: var(--danger)"
                  >0.00 ر.س</span
                >
              </div>
            </div>
          </div>
        </div>

        <div
          class="modal-footer"
          style="
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            padding: 16px 20px 20px;
            border-top: 1px solid var(--border);
          "
        >
          <button
            class="btn btn-secondary"
            data-close="supplierTransactionModal"
          >
            إلغاء
          </button>
          <button class="btn btn-primary" id="supplierTransactionSaveBtn">
            حفظ الفاتورة
          </button>
        </div>
      </div>
    </div>

    <script src="assets/js/core/utils.js"></script>
    <script src="assets/js/core/api.js"></script>
    <script src="assets/js/components/layout.js"></script>
    <script src="assets/js/pages/supplier-view.js"></script>
  </body>
</html>
