<!doctype html>
<html dir="rtl" lang="ar" data-page="customer-view">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#8F1720" />
    <meta name="description" content="ملف العميل - شواطئ عدن" />
    <title>ملف العميل - شواطئ عدن</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="assets/css/global.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="assets/images/logo.png" />
    <style>
      /* تنسيقات حصرية لصفحة عرض العميل */
      .customer-profile-header {
        display: flex;
        align-items: center;
        gap: var(--space-4);
        padding: var(--space-4);
        background: var(--surface-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        margin-bottom: var(--space-4);
        box-shadow: var(--shadow-sm);
      }
      .customer-profile-header .avatar {
        width: 56px;
        height: 56px;
        border-radius: var(--radius-md);
        background: var(--primary-soft);
        color: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: 700;
        flex-shrink: 0;
      }
      .customer-profile-header .info {
        flex: 1;
      }
      .customer-profile-header .info .name {
        font-size: 18px;
        font-weight: 800;
        color: var(--text);
      }
      .customer-profile-header .info .phone {
        font-size: 14px;
        color: var(--text-muted);
        direction: ltr;
        text-align: start;
      }
      .customer-profile-header .info .address {
        font-size: 13px;
        color: var(--text-secondary);
        margin-top: 2px;
      }
      .customer-profile-header .status-badge {
        flex-shrink: 0;
      }

      .profile-summary {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: var(--space-4);
      }
      .profile-summary .stat {
        background: var(--surface-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 12px;
        text-align: center;
        box-shadow: var(--shadow-sm);
      }
      .profile-summary .stat .label {
        font-size: 11px;
        color: var(--text-muted);
        display: block;
      }
      .profile-summary .stat .value {
        font-size: 18px;
        font-weight: 800;
        color: var(--text);
      }
      .profile-summary .stat .value.danger {
        color: var(--danger);
      }
      .profile-summary .stat .value.success {
        color: var(--success);
      }

      .tabs {
        display: flex;
        gap: var(--space-2);
        border-bottom: 1px solid var(--border);
        margin-bottom: var(--space-4);
        overflow-x: auto;
      }
      .tabs .tab {
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 500;
        color: var(--text-muted);
        cursor: pointer;
        border-bottom: 2px solid transparent;
        transition: all 0.15s ease;
        white-space: nowrap;
      }
      .tabs .tab:hover {
        color: var(--text);
      }
      .tabs .tab.active {
        color: var(--primary);
        border-bottom-color: var(--primary);
      }

      .tab-content {
        display: none;
      }
      .tab-content.active {
        display: block;
      }

      .invoice-item {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-2);
        padding: 12px 14px;
        background: var(--surface-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        margin-bottom: var(--space-2);
        box-shadow: var(--shadow-sm);
        transition: all 0.15s ease;
      }
      .invoice-item:hover {
        border-color: var(--border-strong);
      }
      .invoice-item .info {
        flex: 1;
        min-width: 120px;
      }
      .invoice-item .info .title {
        font-weight: 700;
        color: var(--text);
        font-size: 14px;
      }
      .invoice-item .info .sub {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 2px;
      }
      .invoice-item .info .sub span {
        margin-left: 8px;
      }
      .invoice-item .amount-section {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-2);
      }
      .invoice-item .amount-section .total {
        font-weight: 700;
        font-size: 14px;
        color: var(--danger);
      }
      .invoice-item .amount-section .paid {
        font-size: 12px;
        color: var(--text-muted);
      }
      .invoice-item .amount-section .remaining {
        font-size: 12px;
        color: var(--danger);
        font-weight: 700;
      }
      .invoice-item .actions {
        display: flex;
        gap: 2px;
        flex-shrink: 0;
      }

      .payment-item {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-2);
        padding: 12px 14px;
        background: var(--surface-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        margin-bottom: var(--space-2);
        box-shadow: var(--shadow-sm);
        transition: all 0.15s ease;
      }
      .payment-item:hover {
        border-color: var(--border-strong);
      }
      .payment-item .info {
        flex: 1;
        min-width: 120px;
      }
      .payment-item .info .title {
        font-weight: 700;
        color: var(--text);
        font-size: 14px;
      }
      .payment-item .info .sub {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 2px;
      }
      .payment-item .amount {
        font-weight: 700;
        font-size: 14px;
        color: var(--success);
      }
      .payment-item .actions {
        display: flex;
        gap: 2px;
        flex-shrink: 0;
      }

      .statement-item {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid var(--border);
        font-size: 14px;
        align-items: center;
      }
      .statement-item:last-child {
        border-bottom: none;
      }
      .statement-item .desc {
        flex: 1;
        min-width: 100px;
      }
      .statement-item .desc .date {
        color: var(--text-muted);
        font-size: 12px;
        margin-right: 8px;
      }
      .statement-item .debit {
        color: var(--danger);
        font-weight: 700;
        margin-left: 12px;
        min-width: 70px;
        text-align: end;
      }
      .statement-item .credit {
        color: var(--success);
        font-weight: 700;
        margin-left: 12px;
        min-width: 70px;
        text-align: end;
      }
      .statement-item .balance {
        font-weight: 700;
        min-width: 80px;
        text-align: end;
      }

      .empty-state {
        text-align: center;
        padding: var(--space-8) var(--space-4);
        color: var(--text-muted);
      }
      .empty-state i {
        font-size: 36px;
        opacity: 0.3;
        margin-bottom: var(--space-3);
        display: block;
      }
      .empty-state h4 {
        font-size: 16px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: var(--space-1);
      }
      .empty-state p {
        font-size: 14px;
      }

      @media (max-width: 767px) {
        .profile-summary {
          grid-template-columns: 1fr 1fr 1fr;
          gap: 6px;
        }
        .profile-summary .stat {
          padding: 8px;
        }
        .profile-summary .stat .value {
          font-size: 15px;
        }
        .customer-profile-header .avatar {
          width: 44px;
          height: 44px;
          font-size: 18px;
        }
        .customer-profile-header .info .name {
          font-size: 16px;
        }
        .invoice-item {
          padding: 10px 12px;
        }
        .payment-item {
          padding: 10px 12px;
        }
        .statement-item {
          font-size: 13px;
          flex-wrap: wrap;
          gap: 4px;
        }
        .statement-item .desc {
          width: 100%;
        }
        .statement-item .debit,
        .statement-item .credit,
        .statement-item .balance {
          min-width: 50px;
          font-size: 13px;
        }
      }
    </style>
    <style>
  .switch-group .switch-btn {
    padding: 8px 16px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-weight: 500;
    border-radius: var(--radius-full);
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .switch-group .switch-btn:hover {
    background: var(--surface);
    color: var(--text);
  }
  .switch-group .switch-btn.active {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 2px 8px rgba(143,23,32,0.25);
  }
  .switch-group .switch-btn i {
    font-size: 14px;
  }
  .payment-method-option {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg);
    cursor: pointer;
    transition: all 0.15s ease;
    font-size: 14px;
    color: var(--text-secondary);
  }
  .payment-method-option:has(input:checked) {
    border-color: var(--primary);
    background: var(--primary-soft);
    color: var(--primary);
  }
  .payment-method-option input {
    display: none;
  }
  .section-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px 14px;
  }
  .section-title {
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  @media (max-width: 600px) {
    .modal-dialog {
      max-width: 95vw;
    }
    .switch-group .switch-btn {
      font-size: 13px;
      padding: 6px 12px;
    }
    .modal-body {
      padding: 12px !important;
    }
    .section-card {
      padding: 10px;
    }
    .form-grid-2 {
      grid-template-columns: 1fr;
    }
  }
</style>
  </head>
  <body>
    <div id="loadingScreen" class="loading-screen">
      <div class="loading-content">
        <div class="loading-logo"><i class="fas fa-utensils"></i></div>
        <h1 class="loading-title">شواطئ عدن</h1>
        <p class="loading-subtitle">مطابخ ومطاعم</p>
        <div class="loading-dots"><span></span><span></span><span></span></div>
      </div>
    </div>

    <div class="app">
      <aside id="sidebar" class="sidebar"></aside>
      <div id="sidebarOverlay" class="sidebar-overlay"></div>
      <div class="main-area">
        <header id="header" class="header"></header>
        <main class="content" id="pageContent">
          <div id="customerViewContent">
            <!-- سيتم تعبئتها بواسطة JavaScript -->
          </div>
        </main>
      </div>
    </div>

    <nav id="bottomNav" class="bottom-nav"></nav>
    <button id="fab" class="fab" aria-label="إضافة حجز/دفعة"><i class="fas fa-plus"></i></button>
    <div id="modalContainer"></div>
    <div id="toastContainer" class="toast-container"></div>

    <!-- تم إزالة customerPaymentModal – استخدام transactionModal فقط -->


<!-- سكريبت التبديل بين الوضعين -->
<script>
  function setTransactionMode(mode) {
    // تحديث أزرار التبديل
    document.querySelectorAll('.switch-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.mode === mode);
    });
    // إظهار/إخفاء المحتوى
    document.getElementById('bookingMode').style.display = (mode === 'booking') ? 'block' : 'none';
    document.getElementById('paymentMode').style.display = (mode === 'payment') ? 'block' : 'none';
    // تحديث عنوان المودال
    const title = document.getElementById('transactionModalTitle');
    if (mode === 'booking') {
      title.textContent = 'حجز جديد';
      document.getElementById('transactionSaveBtn').textContent = 'حفظ الحجز';
    } else {
      title.textContent = 'تسجيل دفعة';
      document.getElementById('transactionSaveBtn').textContent = 'تسجيل الدفعة';
    }
  }
</script>
    <script src="assets/js/core/utils.js"></script>
    <script src="assets/js/core/api.js"></script>
    <script src="assets/js/components/layout.js"></script>
    <script src="assets/js/pages/customer-view.js"></script>
  </body>
</html>
