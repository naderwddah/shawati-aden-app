<!-- Global Modals -->
<!-- 1) Confirm -->
<div class="modal" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="modal-overlay" data-close></div>
  <div class="modal-dialog">
    <div class="modal-header">
      <h3 class="modal-title" id="confirmTitle">تأكيد</h3>
      <button type="button" class="modal-close" data-close aria-label="إغلاق"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body"><p class="modal-message" id="confirmMessage">هل أنت متأكد؟</p></div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-close>إلغاء</button>
      <button type="button" class="btn btn-primary" id="confirmBtn">تأكيد</button>
    </div>
  </div>
</div>

<!-- 2) Status -->
<div class="modal" id="statusModal" role="dialog" aria-modal="true" aria-labelledby="statusModalTitle">
  <div class="modal-overlay" data-close></div>
  <div class="modal-dialog">
    <div class="modal-header">
      <h3 class="modal-title" id="statusModalTitle">تغيير حالة الحجز</h3>
      <button type="button" class="modal-close" data-close aria-label="إغلاق"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
      <div class="status-options" id="statusOptions">
        <label class="status-option" data-status="جديد"><input type="radio" name="status" value="جديد"><span class="status-option-dot" style="background:var(--primary)"></span><span class="status-option-text">جديد</span></label>
        <label class="status-option" data-status="مؤكد"><input type="radio" name="status" value="مؤكد"><span class="status-option-dot" style="background:var(--success)"></span><span class="status-option-text">مؤكد</span></label>
        <label class="status-option" data-status="مكتمل"><input type="radio" name="status" value="مكتمل"><span class="status-option-dot" style="background:var(--warning)"></span><span class="status-option-text">مكتمل</span></label>
        <label class="status-option" data-status="ملغي"><input type="radio" name="status" value="ملغي"><span class="status-option-dot" style="background:var(--danger)"></span><span class="status-option-text">ملغي</span></label>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-close>إلغاء</button>
      <button type="button" class="btn btn-primary" id="statusConfirmBtn">حفظ</button>
    </div>
  </div>
</div>

<!-- 3) Global Payment -->
<div class="modal" id="paymentModal" role="dialog" aria-modal="true" aria-labelledby="paymentModalTitle">
  <div class="modal-overlay" data-close></div>
  <div class="modal-dialog">
    <div class="modal-header">
      <h3 class="modal-title" id="paymentModalTitle">تحصيل دفعة</h3>
      <button type="button" class="modal-close" data-close aria-label="إغلاق"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
      <div class="payment-info">
        <div class="payment-row"><span class="payment-label">العميل</span><span class="payment-value" id="paymentCustomer">—</span></div>
        <div class="payment-row"><span class="payment-label">المبلغ المتبقي</span><span class="payment-remaining" id="paymentRemaining">0 ريال</span></div>
      </div>
      <div class="form-group">
        <label class="form-label" for="paymentAmount">مبلغ الدفعة <span class="req">*</span></label>
        <input type="number" class="form-input form-input-lg" id="paymentAmount" placeholder="0" min="0" step="0.01" inputmode="decimal">
        <p class="form-hint">أدخل المبلغ المطلوب تحصيله</p>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-close>إلغاء</button>
      <button type="button" class="btn btn-primary" id="paymentConfirmBtn">تأكيد الدفعة</button>
    </div>
  </div>
</div>

<!-- 4) Generic Message: success / error / warning / info -->
<div class="modal" id="messageModal" role="dialog" aria-modal="true" aria-labelledby="messageModalTitle">
  <div class="modal-overlay" data-close></div>
  <div class="modal-dialog">
    <div class="modal-header">
      <div class="modal-title-wrap" style="display:flex;align-items:center;gap:10px;">
        <span id="messageModalIcon" aria-hidden="true"><i class="fas fa-circle-info"></i></span>
        <h3 class="modal-title" id="messageModalTitle">رسالة</h3>
      </div>
      <button type="button" class="modal-close" data-close aria-label="إغلاق"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body"><p class="modal-message" id="messageModalText">—</p></div>
    <div class="modal-footer"><button type="button" class="btn btn-primary" id="messageModalBtn" data-close>حسناً</button></div>
  </div>
</div>

<!-- 5) Success -->
<div class="modal" id="successModal" role="dialog" aria-modal="true" aria-labelledby="successModalTitle">
  <div class="modal-overlay" data-close></div>
  <div class="modal-dialog">
    <div class="modal-header"><h3 class="modal-title" id="successModalTitle">تم بنجاح</h3><button type="button" class="modal-close" data-close aria-label="إغلاق"><i class="fas fa-times"></i></button></div>
    <div class="modal-body"><div class="modal-status-content" id="successModalContent"><div class="modal-status-icon" aria-hidden="true"><i class="fas fa-circle-check"></i></div><p class="modal-message" id="successModalMessage">تم تنفيذ العملية بنجاح.</p></div></div>
    <div class="modal-footer"><button type="button" class="btn btn-primary" id="successModalBtn" data-close>حسناً</button></div>
  </div>
</div>

<!-- 6) Error -->
<div class="modal" id="errorModal" role="dialog" aria-modal="true" aria-labelledby="errorModalTitle">
  <div class="modal-overlay" data-close></div>
  <div class="modal-dialog">
    <div class="modal-header"><h3 class="modal-title" id="errorModalTitle">حدث خطأ</h3><button type="button" class="modal-close" data-close aria-label="إغلاق"><i class="fas fa-times"></i></button></div>
    <div class="modal-body"><div class="modal-status-content" id="errorModalContent"><div class="modal-status-icon" aria-hidden="true"><i class="fas fa-circle-xmark"></i></div><p class="modal-message" id="errorModalMessage">تعذر تنفيذ العملية.</p></div></div>
    <div class="modal-footer"><button type="button" class="btn btn-primary" id="errorModalBtn" data-close>حسناً</button></div>
  </div>
</div>

<!-- 7) Warning -->
<div class="modal" id="warningModal" role="dialog" aria-modal="true" aria-labelledby="warningModalTitle">
  <div class="modal-overlay" data-close></div>
  <div class="modal-dialog">
    <div class="modal-header"><h3 class="modal-title" id="warningModalTitle">تنبيه</h3><button type="button" class="modal-close" data-close aria-label="إغلاق"><i class="fas fa-times"></i></button></div>
    <div class="modal-body"><div class="modal-status-content" id="warningModalContent"><div class="modal-status-icon" aria-hidden="true"><i class="fas fa-triangle-exclamation"></i></div><p class="modal-message" id="warningModalMessage">يرجى الانتباه.</p></div></div>
    <div class="modal-footer"><button type="button" class="btn btn-primary" id="warningModalBtn" data-close>حسناً</button></div>
  </div>
</div>

<!-- 8) Info -->
<div class="modal" id="infoModal" role="dialog" aria-modal="true" aria-labelledby="infoModalTitle">
  <div class="modal-overlay" data-close></div>
  <div class="modal-dialog">
    <div class="modal-header"><h3 class="modal-title" id="infoModalTitle">معلومة</h3><button type="button" class="modal-close" data-close aria-label="إغلاق"><i class="fas fa-times"></i></button></div>
    <div class="modal-body"><div class="modal-status-content" id="infoModalContent"><div class="modal-status-icon" aria-hidden="true"><i class="fas fa-circle-info"></i></div><p class="modal-message" id="infoModalMessage">—</p></div></div>
    <div class="modal-footer"><button type="button" class="btn btn-primary" id="infoModalBtn" data-close>حسناً</button></div>
  </div>
</div>

<!-- 9) Global Loading -->
<div class="modal" id="globalLoadingModal" role="dialog" aria-modal="true" aria-labelledby="globalLoadingTitle" aria-busy="true">
  <div class="modal-overlay"></div>
  <div class="modal-dialog">
    <div class="modal-body" style="text-align:center;padding:32px 24px;">
      <div class="modal-status-icon" id="globalLoadingIcon" aria-hidden="true"><i class="fas fa-spinner fa-spin"></i></div>
      <h3 class="modal-title" id="globalLoadingTitle" style="margin-top:16px;">جاري التحميل</h3>
      <p class="modal-message" id="globalLoadingMessage">يرجى الانتظار...</p>
    </div>
  </div>
</div>

  لا نضيف transactionModal أو نوافذ CRUD الخاصة بالصفحات في هذه المرحلة.
