<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>التقارير المالية - شواطئ عدن</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Cairo", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background: #f5f0eb;
    padding: 16px;
    min-height: 100vh;
  }
  .container {
    max-width: 1400px;
    margin: 0 auto;
  }

  /* ===== App Bar ===== */
  .app-bar {
    background: #1e1a17;
    border-radius: 16px;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    flex-wrap: wrap;
    gap: 12px;
  }
  .app-bar .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .app-bar .brand i {
    font-size: 24px;
    color: #f1c40f;
  }
  .app-bar .brand h1 {
    color: #fff;
    font-size: 18px;
    font-weight: 900;
  }
  .app-bar .brand span {
    color: #f1c40f;
  }
  .app-bar .back-btn {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #fff;
    padding: 8px 18px;
    border-radius: 30px;
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
    transition: 0.3s;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .app-bar .back-btn:hover {
    background: rgba(255, 215, 0, 0.15);
    border-color: #f1c40f;
  }

  /* ===== Filters ===== */
  .filters-card {
    background: #fff;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    border: 1px solid #eae3dd;
  }
  .filters-card .filter-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1 1 100%;
    flex-wrap: wrap;
    min-width: 0;
  }
  .filters-card label {
    font-weight: 700;
    color: #4a3f39;
    font-size: 13px;
    white-space: nowrap;
  }
  .filters-card input[type="date"] {
    flex: 1 1 120px;
    min-width: 0;
    padding: 10px 12px;
    border: 2px solid #e0d6ce;
    border-radius: 12px;
    background: #faf8f6;
    font-weight: 600;
    color: #1e1a17;
    outline: none;
    transition: 0.3s;
    font-size: 14px;
  }
  .filters-card input[type="date"]:focus {
    border-color: #b8860b;
  }
  .filters-card .filter-group span {
    font-weight: 700;
    color: #8a7a70;
    font-size: 13px;
    white-space: nowrap;
    padding: 0 2px;
  }

  .quick-btns {
    display: flex;
    gap: 6px;
    flex: 1 1 100%;
    justify-content: flex-start;
  }
  .quick-btns button {
    flex: 1;
    padding: 10px 16px;
    border: none;
    border-radius: 12px;
    background: #f0ebe7;
    font-weight: 700;
    color: #4a3f39;
    cursor: pointer;
    font-size: 13px;
    transition: 0.3s;
    white-space: nowrap;
  }
  .quick-btns button:hover {
    background: #b8860b;
    color: #fff;
  }

  .btn-primary {
    background: #1e1a17;
    color: #fff;
    border: none;
    padding: 12px 24px;
    border-radius: 12px;
    font-weight: 800;
    cursor: pointer;
    transition: 0.3s;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex: 1 1 100%;
  }
  .btn-primary:hover {
    background: #b8860b;
  }

  /* ===== KPI Cards ===== */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .kpi-card {
    background: #fff;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    border-right: 5px solid #b8860b;
    position: relative;
  }
  .kpi-card .label {
    font-size: 13px;
    font-weight: 800;
    color: #8a7a70;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .kpi-card .value {
    font-size: 24px;
    font-weight: 900;
    color: #1e1a17;
    line-height: 1.2;
  }
  .kpi-card .sub {
    font-size: 13px;
    font-weight: 700;
    color: #8a7a70;
    margin-top: 2px;
  }
  .kpi-card.gold {
    border-right-color: #b8860b;
  }
  .kpi-card.gold .value {
    color: #b8860b;
  }
  .kpi-card.green {
    border-right-color: #2e8b57;
  }
  .kpi-card.green .value {
    color: #2e8b57;
  }
  .kpi-card.red {
    border-right-color: #c0392b;
  }
  .kpi-card.red .value {
    color: #c0392b;
  }
  .kpi-card.blue {
    border-right-color: #2980b9;
  }
  .kpi-card.blue .value {
    color: #2980b9;
  }

  /* ===== Table ===== */
  .table-container {
    background: #fff;
    border-radius: 16px;
    padding: 16px 0 0 0;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    overflow: hidden;
    margin-bottom: 24px;
  }
  .table-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 16px 16px 16px;
    flex-wrap: wrap;
    gap: 12px;
    border-bottom: 1px solid #f0ebe7;
    margin-bottom: 8px;
  }
  .table-toolbar h3 {
    font-weight: 800;
    color: #1e1a17;
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .table-toolbar h3 i {
    color: #b8860b;
  }
  .table-toolbar .actions button {
    padding: 10px 20px;
    border: none;
    border-radius: 12px;
    font-weight: 800;
    cursor: pointer;
    background: #1e1a17;
    color: #fff;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
  }

  .table-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    min-width: 800px;
  }
  table thead {
    background: #f8f4f0;
  }
  table thead th {
    padding: 14px 12px;
    text-align: right;
    font-weight: 800;
    color: #4a3f39;
    white-space: nowrap;
    border-bottom: 2px solid #e0d6ce;
  }
  table tbody td {
    padding: 14px 12px;
    text-align: right;
    border-bottom: 1px solid #f0ebe7;
    color: #1e1a17;
    font-weight: 600;
    white-space: nowrap;
  }
  table tbody tr:hover {
    background: #fdfcfb;
  }

  .badge-paid {
    background: #d4edda;
    color: #155724;
    padding: 4px 12px;
    border-radius: 8px;
    font-weight: 800;
    font-size: 12px;
  }
  .badge-unpaid {
    background: #f8d7da;
    color: #721c24;
    padding: 4px 12px;
    border-radius: 8px;
    font-weight: 800;
    font-size: 12px;
  }
  .total-row td {
    background: #1e1a17;
    font-weight: 900;
    font-size: 15px;
    color: #fff;
    border: none;
  }
  .remaining-zero {
    color: #2e8b57;
    font-weight: 800;
  }
  .remaining-positive {
    color: #c0392b;
    font-weight: 900;
  }

  /* ===== Responsive (الجوال أولاً) ===== */

  /* شاشات صغيرة جداً (أقل من 480px) */
  @media (max-width: 480px) {
    body {
      padding: 10px;
    }

    .app-bar {
      padding: 10px 14px;
      border-radius: 12px;
    }
    .app-bar .brand h1 {
      font-size: 15px;
    }
    .app-bar .back-btn {
      padding: 6px 10px;
      font-size: 12px;
    }
    .app-bar .back-btn span {
      display: none;
    }

    .filters-card {
      padding: 10px;
      gap: 10px;
      border-radius: 12px;
    }
    .filters-card .filter-group {
      gap: 4px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .filters-card input[type="date"] {
      flex: 1 1 80px;
      min-width: 70px;
      padding: 10px 6px;
      font-size: 12px;
      border-radius: 10px;
    }
    .filters-card .filter-group span {
      font-size: 12px;
      padding: 0 2px;
    }

    .quick-btns {
      gap: 4px;
    }
    .quick-btns button {
      flex: 1 1 60px;
      padding: 8px 6px;
      font-size: 11px;
      border-radius: 10px;
    }

    .btn-primary {
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 10px;
    }

    .kpi-grid {
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .kpi-card {
      padding: 12px 10px;
      border-radius: 12px;
    }
    .kpi-card .value {
      font-size: 18px;
    }
    .kpi-card .label {
      font-size: 10px;
    }

    .table-toolbar {
      flex-direction: column;
      align-items: stretch;
      padding: 0 10px 12px 10px;
    }
    .table-toolbar .actions button {
      padding: 8px 12px;
      font-size: 12px;
    }
    table {
      font-size: 11px;
      min-width: 600px;
    }
    table thead th,
    table tbody td {
      padding: 8px 6px;
      font-size: 11px;
    }
    .badge-paid,
    .badge-unpaid {
      font-size: 10px;
      padding: 2px 8px;
    }
    .total-row td {
      font-size: 13px;
    }
  }

  /* شاشات متوسطة (481px - 768px) */
  @media (min-width: 481px) and (max-width: 768px) {
    body {
      padding: 12px;
    }

    .app-bar {
      padding: 12px 16px;
    }

    .filters-card {
      padding: 14px;
      gap: 12px;
    }
    .filters-card .filter-group {
      gap: 6px;
      flex-wrap: wrap;
    }
    .filters-card input[type="date"] {
      flex: 1 1 100px;
      font-size: 13px;
      padding: 10px 10px;
    }
    .quick-btns button {
      font-size: 12px;
      padding: 8px 12px;
    }
    .btn-primary {
      font-size: 13px;
      padding: 10px 16px;
    }

    .kpi-grid {
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .kpi-card {
      padding: 14px 12px;
    }
    .kpi-card .value {
      font-size: 20px;
    }

    .table-toolbar {
      flex-direction: row;
      flex-wrap: wrap;
    }
    .table-toolbar .actions button {
      width: auto;
    }
    table {
      font-size: 12px;
      min-width: 700px;
    }
  }

  /* شاشات كبيرة (أكثر من 768px) */
  @media (min-width: 769px) {
    .filters-card .filter-group {
      flex: 2;
      flex-wrap: nowrap;
    }
    .quick-btns {
      flex: 1;
      justify-content: flex-end;
    }
    .btn-primary {
      flex: 0 1 auto;
    }
  }
</style>
  </head>
  <body>
    <div class="container" id="app">
      <!-- شريط التنقل -->
      <div class="app-bar">
        <div class="brand">
          <i class="fas fa-utensils"></i>
          <h1>شواطئ <span>عدن</span></h1>
        </div>
        <button class="back-btn" onclick="window.location.href = 'index.html'">
          <i class="fas fa-arrow-right"></i> <span>العودة للرئيسية</span>
        </button>
      </div>

      <!-- الفلاتر -->
      <div class="filters-card">
        <div class="filter-group">
          <input type="date" id="fromDate" title="من تاريخ" />
          <span style="font-weight: bold; color: #8a7a70">إلى</span>
          <input type="date" id="toDate" title="إلى تاريخ" />
        </div>
        <div class="quick-btns">
          <button onclick="setQuickDate('today')">اليوم</button>
          <button onclick="setQuickDate('week')">أسبوع</button>
          <button onclick="setQuickDate('month')">شهر</button>
        </div>
        <button class="btn-primary" onclick="fetchAndRender()">
          <i class="fas fa-sync-alt"></i> عرض التقرير
        </button>
      </div>

      <!-- المؤشرات (KPIs) -->
      <div class="kpi-grid" id="kpiGrid">
        <div class="kpi-card gold">
          <div class="label"><i class="fas fa-coins"></i> إجمالي الطلبات</div>
          <div class="value" id="totalRevenue">0.00</div>
          <div class="sub">ر.س</div>
        </div>
        <div class="kpi-card green">
          <div class="label">
            <i class="fas fa-hand-holding-usd"></i> المحصل (المدفوع)
          </div>
          <div class="value" id="totalPaid">0.00</div>
          <div class="sub">ر.س</div>
        </div>
        <div class="kpi-card red">
          <div class="label">
            <i class="fas fa-file-invoice-dollar"></i> الديون المتبقية
          </div>
          <div class="value" id="totalRemaining">0.00</div>
          <div class="sub">ر.س</div>
        </div>
        <div class="kpi-card blue">
          <div class="label"><i class="fas fa-receipt"></i> عدد الفواتير</div>
          <div class="value" id="totalCount">0</div>
          <div class="sub">فاتورة معتمدة</div>
        </div>
      </div>

      <!-- الجدول -->
      <div class="table-container">
        <div class="table-toolbar">
          <h3><i class="fas fa-list-ul"></i> تفاصيل الفواتير</h3>
          <div class="actions">
            <button onclick="openPreview()">
              <i class="fas fa-print"></i> معاينة وتصدير التقرير
            </button>
          </div>
        </div>
        <div class="table-scroll">
          <table id="reportTable">
            <thead>
              <tr>
                <th style="width: 5%">#</th>
                <th style="width: 25%">اسم العميل</th>
                <th style="width: 15%">التاريخ</th>
                <th style="width: 15%">إجمالي الطلبات</th>
                <th style="width: 15%">المدفوع</th>
                <th style="width: 15%">المتبقي</th>
                <th style="width: 10%">حالة الفاتورة</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr>
                <td
                  colspan="7"
                  style="
                    text-align: center;
                    padding: 40px;
                    color: #8a7a70;
                    font-weight: bold;
                  "
                >
                  📭 لا توجد بيانات لعرضها
                </td>
              </tr>
            </tbody>
            <tfoot id="tableFoot" style="display: none"></tfoot>
          </table>
        </div>
      </div>
    </div>

    <script src="report.js"></script>
  </body>
</html>
