<!doctype html>
<html dir="rtl" lang="ar" data-page="reports">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    >
    <meta name="theme-color" content="#8F1720">
    <meta name="description" content="التقارير والإحصائيات - شواطئ عدن">

    <title>التقارير - شواطئ عدن</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css"
    >

    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="assets/images/logo.png">

    <style>
        [data-page="reports"] {
            --reports-primary: #8f1720;
            --reports-primary-dark: #72121a;
            --reports-primary-soft: rgba(143, 23, 32, 0.08);
            --reports-green: #16855b;
            --reports-green-soft: rgba(22, 133, 91, 0.10);
            --reports-orange: #c77718;
            --reports-orange-soft: rgba(199, 119, 24, 0.10);
            --reports-blue: #356ea8;
            --reports-blue-soft: rgba(53, 110, 168, 0.10);
            --reports-danger: #b4232f;
            --reports-danger-soft: rgba(180, 35, 47, 0.10);
        }

        [data-page="reports"] .report-toolbar {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        [data-page="reports"] .filter-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        [data-page="reports"] .chip {
            border: 1px solid var(--border-color, #e5e7eb);
            background: var(--surface, #fff);
            color: var(--text-secondary, #64748b);
            border-radius: 12px;
            padding: 9px 18px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s ease;
        }

        [data-page="reports"] .chip:hover {
            border-color: var(--reports-primary);
            color: var(--reports-primary);
        }

        [data-page="reports"] .chip.active {
            background: var(--reports-primary);
            border-color: var(--reports-primary);
            color: #fff;
            box-shadow: 0 5px 14px rgba(143, 23, 32, .16);
        }

        [data-page="reports"] .date-range-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            padding: 14px;
            background: #fafafa;
            border: 1px solid #eeeeee;
            border-radius: 14px;
        }

        [data-page="reports"] .form-group.compact {
            margin: 0;
        }

        [data-page="reports"] .toolbar-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
        }

        [data-page="reports"] .toolbar-actions .btn {
            min-width: 110px;
        }

        [data-page="reports"] .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 24px;
        }

        [data-page="reports"] .report-kpi {
            position: relative;
            overflow: hidden;
            padding: 18px;
            min-height: 125px;
            border-radius: 16px;
            background: var(--surface, #fff);
            border: 1px solid var(--border-color, #e5e7eb);
            box-shadow: var(--shadow-sm, 0 2px 8px rgba(0,0,0,.04));
        }

        [data-page="reports"] .report-kpi::after {
            content: "";
            position: absolute;
            width: 90px;
            height: 90px;
            left: -32px;
            bottom: -35px;
            border-radius: 50%;
            background: var(--kpi-soft);
        }

        [data-page="reports"] .report-kpi-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            background: var(--kpi-soft);
            color: var(--kpi-color);
        }

        [data-page="reports"] .report-kpi-label {
            color: var(--text-secondary, #64748b);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        [data-page="reports"] .report-kpi-value {
            color: var(--text-primary, #1f2937);
            font-size: 22px;
            font-weight: 800;
            line-height: 1.3;
        }

        [data-page="reports"] .report-kpi-unit {
            font-size: 11px;
            color: var(--text-secondary, #64748b);
            font-weight: 500;
        }

        [data-page="reports"] .content-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.35fr) minmax(300px, .65fr);
            gap: 24px;
            margin-bottom: 24px;
        }

        [data-page="reports"] .chart-container {
            background: var(--surface, #fff);
            border: 1px solid var(--border-color, #e5e7eb);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-sm, 0 2px 8px rgba(0,0,0,.04));
        }

        [data-page="reports"] .chart-bars {
            min-height: 280px;
            padding: 28px 24px 18px;
            display: flex;
            align-items: flex-end;
            gap: 12px;
            overflow-x: auto;
        }

        [data-page="reports"] .chart-column {
            min-width: 46px;
            flex: 1;
            height: 230px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
        }

        [data-page="reports"] .chart-value {
            color: var(--text-secondary, #64748b);
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
        }

        [data-page="reports"] .chart-bar-track {
            width: 100%;
            height: 175px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            background: linear-gradient(
                to top,
                rgba(143, 23, 32, .025),
                rgba(143, 23, 32, 0)
            );
            border-radius: 9px;
        }

        [data-page="reports"] .chart-bar {
            width: min(34px, 70%);
            min-height: 3px;
            background: var(--reports-primary);
            border-radius: 8px 8px 3px 3px;
            transition: height .45s ease;
        }

        [data-page="reports"] .chart-label {
            color: var(--text-secondary, #64748b);
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
        }

        [data-page="reports"] .chart-legend {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 0 24px 20px;
        }

        [data-page="reports"] .chart-legend-item {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--text-secondary, #64748b);
            font-size: 11px;
        }

        [data-page="reports"] .chart-legend-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--reports-primary);
        }

        [data-page="reports"] #statusDistribution {
            padding: 18px;
        }

        [data-page="reports"] .status-row {
            margin-bottom: 17px;
        }

        [data-page="reports"] .status-row:last-child {
            margin-bottom: 0;
        }

        [data-page="reports"] .status-row-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 7px;
        }

        [data-page="reports"] .status-name {
            color: var(--text-primary, #1f2937);
            font-size: 12px;
            font-weight: 700;
        }

        [data-page="reports"] .status-count {
            color: var(--text-secondary, #64748b);
            font-size: 11px;
            font-weight: 600;
        }

        [data-page="reports"] .status-progress {
            height: 8px;
            background: #f0f1f3;
            border-radius: 99px;
            overflow: hidden;
        }

        [data-page="reports"] .status-progress-fill {
            height: 100%;
            border-radius: inherit;
            background: var(--reports-primary);
            transition: width .4s ease;
        }

        [data-page="reports"] .top-customer-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        [data-page="reports"] .top-customer {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 13px;
            background: #fafafa;
            border: 1px solid #eeeeee;
        }

        [data-page="reports"] .top-customer-rank {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: var(--reports-primary-soft);
            color: var(--reports-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            flex: 0 0 auto;
        }

        [data-page="reports"] .top-customer-info {
            min-width: 0;
            flex: 1;
        }

        [data-page="reports"] .top-customer-name {
            color: var(--text-primary, #1f2937);
            font-size: 13px;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        [data-page="reports"] .top-customer-meta {
            color: var(--text-secondary, #64748b);
            font-size: 10px;
            margin-top: 2px;
        }

        [data-page="reports"] .top-customer-total {
            color: var(--reports-primary);
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }

        [data-page="reports"] .report-empty {
            padding: 35px 20px;
            text-align: center;
            color: var(--text-secondary, #64748b);
        }

        [data-page="reports"] .report-empty i {
            display: block;
            font-size: 28px;
            margin-bottom: 10px;
            opacity: .5;
        }

        [data-page="reports"] .report-empty strong {
            display: block;
            color: var(--text-primary, #1f2937);
            font-size: 13px;
            margin-bottom: 4px;
        }

        [data-page="reports"] .report-empty span {
            font-size: 11px;
        }

        [data-page="reports"] .report-status {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 5px 9px;
            border-radius: 99px;
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
        }

        [data-page="reports"] .report-status.new {
            background: var(--reports-blue-soft);
            color: var(--reports-blue);
        }

        [data-page="reports"] .report-status.confirmed {
            background: var(--reports-green-soft);
            color: var(--reports-green);
        }

        [data-page="reports"] .report-status.completed {
            background: var(--reports-primary-soft);
            color: var(--reports-primary);
        }

        [data-page="reports"] .report-status.cancelled {
            background: var(--reports-danger-soft);
            color: var(--reports-danger);
        }

        [data-page="reports"] .report-type {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--reports-primary);
            font-size: 11px;
            font-weight: 700;
        }

        [data-page="reports"] .report-amount {
            font-weight: 800;
            white-space: nowrap;
        }

        [data-page="reports"] .report-loading {
            padding: 50px 20px;
            text-align: center;
            color: var(--text-secondary, #64748b);
        }

        [data-page="reports"] .report-loading i {
            font-size: 22px;
            margin-bottom: 10px;
        }

        @media (max-width: 1000px) {
            [data-page="reports"] .kpi-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            [data-page="reports"] .content-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 650px) {
            [data-page="reports"] .date-range-panel {
                grid-template-columns: 1fr;
            }

            [data-page="reports"] .toolbar-actions {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
            }

            [data-page="reports"] .toolbar-actions .btn {
                min-width: 0;
                padding-inline: 8px;
            }

            [data-page="reports"] .kpi-grid {
                gap: 9px;
            }

            [data-page="reports"] .report-kpi {
                padding: 13px;
                min-height: 112px;
            }

            [data-page="reports"] .report-kpi-value {
                font-size: 18px;
            }

            [data-page="reports"] .chart-bars {
                padding-inline: 14px;
            }
        }

        @media (max-width: 430px) {
            [data-page="reports"] .toolbar-actions {
                grid-template-columns: 1fr;
            }

            [data-page="reports"] .filter-chips {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
            }

            [data-page="reports"] .chip {
                width: 100%;
            }
        }

        @media print {
            [data-page="reports"] .sidebar,
            [data-page="reports"] .header,
            [data-page="reports"] .bottom-nav,
            [data-page="reports"] .fab,
            [data-page="reports"] .toolbar-actions,
            [data-page="reports"] .filter-chips {
                display: none !important;
            }

            [data-page="reports"] .main-area {
                margin: 0 !important;
                width: 100% !important;
            }

            [data-page="reports"] .content {
                padding: 0 !important;
            }

            [data-page="reports"] .card,
            [data-page="reports"] .chart-container,
            [data-page="reports"] .report-kpi {
                box-shadow: none !important;
                break-inside: avoid;
            }
        }
    </style>
</head>

<body>

<div id="loadingScreen" class="loading-screen">
    <div class="loading-content">
        <div class="loading-logo">
            <i class="fas fa-utensils"></i>
        </div>

        <h1 class="loading-title">شواطئ عدن</h1>
        <p class="loading-subtitle">مطابخ ومطاعم</p>

        <div class="loading-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
</div>

<div class="app">

    <aside id="sidebar" class="sidebar"></aside>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <div class="main-area">

        <header id="header" class="header"></header>

        <main class="content" id="pageContent">

            <div class="page-header">
                <div>
                    <h1 class="page-title">التقارير</h1>
                    <p class="page-subtitle">تحليلات الأداء والإيرادات</p>
                </div>
            </div>

            <div class="card mb-6">

                <div class="card-header">
                    <h2 class="card-title">الفترة الزمنية</h2>
                </div>

                <div class="report-toolbar">

                    <div class="filter-chips">

                        <button
                            class="chip active"
                            type="button"
                            data-period="day"
                        >
                            يومي
                        </button>

                        <button
                            class="chip"
                            type="button"
                            data-period="week"
                        >
                            أسبوعي
                        </button>

                        <button
                            class="chip"
                            type="button"
                            data-period="month"
                        >
                            شهري
                        </button>

                        <button
                            class="chip"
                            type="button"
                            data-period="custom"
                        >
                            مخصص
                        </button>

                    </div>

                    <div
                        class="date-range-panel"
                        id="customDateRange"
                        style="display:none"
                    >

                        <div class="form-group compact">
                            <label for="reportStartDate">من</label>
                            <input
                                type="date"
                                id="reportStartDate"
                                class="form-input"
                            >
                        </div>

                        <div class="form-group compact">
                            <label for="reportEndDate">إلى</label>
                            <input
                                type="date"
                                id="reportEndDate"
                                class="form-input"
                            >
                        </div>

                    </div>

                    <div class="toolbar-actions">

                        <button
                            class="btn btn-secondary btn-sm"
                            type="button"
                            id="exportCsvBtn"
                        >
                            <i class="fas fa-file-csv"></i>
                            CSV
                        </button>

                        <button
                            class="btn btn-secondary btn-sm"
                            type="button"
                            id="exportJsonBtn"
                        >
                            <i class="fas fa-file-code"></i>
                            JSON
                        </button>

                        <button
                            class="btn btn-primary btn-sm"
                            type="button"
                            id="shareReportBtn"
                        >
                            <i class="fas fa-share-alt"></i>
                            مشاركة
                        </button>

                    </div>

                </div>

            </div>

            <div class="kpi-grid" id="reportSummary"></div>

            <div class="content-grid">

                <div class="chart-container">

                    <div class="card-header">
                        <h2 class="card-title">الاتجاه الزمني للأرباح</h2>
                    </div>

                    <div
                        class="chart-bars"
                        id="monthlyChart"
                    ></div>

                    <div class="chart-legend">

                        <div class="chart-legend-item">
                            <span class="chart-legend-dot"></span>
                            <span>الإيرادات</span>
                        </div>

                    </div>

                </div>

                <div class="card">

                    <div class="card-header">
                        <h2 class="card-title">توزيع الحالات</h2>
                    </div>

                    <div
                        class="card-body"
                        id="statusDistribution"
                    ></div>

                </div>

            </div>

            <div class="card mt-6">

                <div class="card-header">
                    <h2 class="card-title">أفضل العملاء</h2>
                </div>

                <div
                    class="card-body"
                    id="topHalls"
                ></div>

            </div>

            <div class="card mt-6">

                <div class="card-header">
                    <h2 class="card-title">تفاصيل التقرير</h2>
                </div>

                <div class="table-wrapper">

                    <table class="data-table">

                        <thead>
                            <tr>
                                <th>النوع</th>
                                <th>الاسم</th>
                                <th>التاريخ</th>
                                <th>المبلغ</th>
                                <th>الحالة</th>
                            </tr>
                        </thead>

                        <tbody id="reportDetailTable"></tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

</div>

<nav id="bottomNav" class="bottom-nav"></nav>

<button
    id="fab"
    class="fab"
    aria-label="حجز جديد"
    type="button"
>
    <i class="fas fa-plus"></i>
</button>

<div id="modalContainer"></div>

<div
    id="toastContainer"
    class="toast-container"
></div>

<script src="assets/js/core/utils.js"></script>
<script src="assets/js/core/api.js"></script>
<script src="assets/js/components/layout.js"></script>
<script src="assets/js/pages/reports.js"></script>

</body>
</html>
