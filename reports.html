<!doctype html>
<html dir="rtl" lang="ar" data-page="reports">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#8F1720" />
    <meta name="description" content="التقارير والإحصائيات - شواطئ عدن" />
    <title>التقارير - شواطئ عدن</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/css/global.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="assets/images/logo.png" />
  </head>
  <body>
    <div id="loadingScreen" class="loading-screen">
      <div class="loading-content">
        <div class="loading-logo"><i class="fas fa-utensils"></i></div>
        <h1 class="loading-title">شواطئ عدن</h1>
        <p class="loading-subtitle">مطابخ ومطاعم</p>
        <div class="loading-dots"><span></span><span></span><span></span></div>
      </div>
    </div>

    <div class="app">
      <aside id="sidebar" class="sidebar"></aside>
      <div id="sidebarOverlay" class="sidebar-overlay"></div>

      <div class="main-area">
        <header id="header" class="header"></header>

        <main class="content" id="pageContent">
          <div class="page-header">
            <div>
              <h1 class="page-title">التقارير</h1>
              <p class="page-subtitle">تحليلات الأداء والإيرادات</p>
            </div>
          </div>

          <div class="card mb-6">
            <div class="card-header">
              <h2 class="card-title">الفترة الزمنية</h2>
            </div>
            <div class="report-toolbar">
              <div class="filter-chips">
                <button class="chip active" type="button" data-period="day">
                  يومي
                </button>
                <button class="chip" type="button" data-period="week">
                  أسبوعي
                </button>
                <button class="chip" type="button" data-period="month">
                  شهري
                </button>
                <button class="chip" type="button" data-period="custom">
                  مخصص
                </button>
              </div>

              <div
                class="date-range-panel"
                id="customDateRange"
                style="display: none"
              >
                <div class="form-group compact">
                  <label>من</label>
                  <input type="date" id="reportStartDate" class="form-input" />
                </div>
                <div class="form-group compact">
                  <label>إلى</label>
                  <input type="date" id="reportEndDate" class="form-input" />
                </div>
              </div>

              <div class="toolbar-actions">
                <button
                  class="btn btn-secondary btn-sm"
                  type="button"
                  id="exportCsvBtn"
                >
                  <i class="fas fa-file-csv"></i> CSV
                </button>
                <button
                  class="btn btn-secondary btn-sm"
                  type="button"
                  id="exportJsonBtn"
                >
                  <i class="fas fa-file-code"></i> JSON
                </button>
                <button
                  class="btn btn-primary btn-sm"
                  type="button"
                  id="shareReportBtn"
                >
                  <i class="fas fa-share-alt"></i> مشاركة
                </button>
              </div>
            </div>
          </div>

          <!-- Summary KPIs -->
          <div class="kpi-grid" id="reportSummary"></div>

          <div class="content-grid">
            <!-- Monthly Revenue Chart -->
            <div class="chart-container">
              <div class="card-header">
                <h2 class="card-title">الاتجاه الزمني للأرباح</h2>
              </div>
              <div class="chart-bars" id="monthlyChart"></div>
              <div class="chart-legend">
                <div class="chart-legend-item">
                  <span
                    class="chart-legend-dot"
                    style="background: var(--primary)"
                  ></span>
                  <span>الإيرادات</span>
                </div>
              </div>
            </div>

            <!-- Status Distribution -->
            <div class="card">
              <div class="card-header">
                <h2 class="card-title">توزيع الحالات</h2>
              </div>
              <div class="card-body" id="statusDistribution"></div>
            </div>
          </div>

          <div class="card mt-6">
            <div class="card-header">
              <h2 class="card-title">أفضل العملاء</h2>
            </div>
            <div class="card-body" id="topHalls"></div>
          </div>

          <div class="card mt-6">
            <div class="card-header">
              <h2 class="card-title">تفاصيل التقرير</h2>
            </div>
            <div class="table-wrapper">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>النوع</th>
                    <th>الاسم</th>
                    <th>التاريخ</th>
                    <th>المبلغ</th>
                    <th>الحالة</th>
                  </tr>
                </thead>
                <tbody id="reportDetailTable"></tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <nav id="bottomNav" class="bottom-nav"></nav>
    <button id="fab" class="fab" aria-label="حجز جديد">
      <i class="fas fa-plus"></i>
    </button>
    <div id="modalContainer"></div>
    <div id="toastContainer" class="toast-container"></div>

    <script src="assets/js/core/utils.js"></script>
    <script src="assets/js/core/state.js"></script>
    <script src="assets/js/core/api.js"></script>
    <script src="assets/js/components/layout.js"></script>
    <script src="assets/js/pages/reports.js"></script>
  </body>
</html>
