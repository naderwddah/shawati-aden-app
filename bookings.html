<!doctype html>
<html dir="rtl" lang="ar" data-page="bookings">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#8F1720" />
    <meta name="description" content="إدارة الحجوزات - شواطئ عدن" />
    <title>الحجوزات - شواطئ عدن</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/css/global.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="assets/images/logo.png" />
  </head>
  <body>
    <div id="loadingScreen" class="loading-screen">
      <div class="loading-content">
        <div class="loading-logo"><i class="fas fa-utensils"></i></div>
        <h1 class="loading-title">شواطئ عدن</h1>
        <p class="loading-subtitle">مطابخ ومطاعم</p>
        <div class="loading-dots"><span></span><span></span><span></span></div>
      </div>
    </div>

    <div class="app">
      <aside id="sidebar" class="sidebar"></aside>
      <div id="sidebarOverlay" class="sidebar-overlay"></div>
      <div class="main-area">
        <header id="header" class="header"></header>
        <main class="content" id="pageContent">
          <div class="page-header">
            <div>
              <h1 class="page-title">الحجوزات</h1>
              <p class="page-subtitle">إدارة حجوزات قاعات المناسبات</p>
            </div>
            <a href="booking-new.html" class="btn btn-primary btn-sm">
              <i class="fas fa-plus"></i>
              <span>حجز جديد</span>
            </a>
          </div>

          <div class="search-bar">
            <i class="fas fa-search search-icon"></i>
            <input
              type="text"
              class="search-input"
              id="bookingSearch"
              placeholder="ابحث بالاسم، رقم الحجز، أو الهاتف..."
            />
          </div>

          <div class="filter-chips" id="filterChips">
            <button class="chip active" data-filter="all">
              الكل <span class="chip-count">0</span>
            </button>
            <button class="chip" data-filter="جديد">
              جديد <span class="chip-count">0</span>
            </button>
            <button class="chip" data-filter="مؤكد">
              مؤكد <span class="chip-count">0</span>
            </button>
            <button class="chip" data-filter="مكتمل">
              مكتمل <span class="chip-count">0</span>
            </button>
            <button class="chip" data-filter="ملغي">
              ملغي <span class="chip-count">0</span>
            </button>
          </div>

          <div
            id="bookingList"
            style="display: flex; flex-direction: column; gap: 16px"
          ></div>
        </main>
      </div>
    </div>

    <nav id="bottomNav" class="bottom-nav"></nav>
    <button id="fab" class="fab" aria-label="حجز جديد">
      <i class="fas fa-plus"></i>
    </button>
    <div id="modalContainer"></div>
    <div id="toastContainer" class="toast-container"></div>

    <script src="assets/js/core/utils.js"></script>
    <script src="assets/js/core/state.js"></script>
    <script src="assets/js/core/api.js"></script>
    <script src="assets/js/components/layout.js"></script>
    <script src="assets/js/pages/bookings.js"></script>
    <script src="assets/js/pages/invoice.js"></script>
  </body>
</html>
