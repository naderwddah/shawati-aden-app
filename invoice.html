<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فاتورة وليمة - شواطئ عدن</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css"
/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    /* ========================================================= */
    /* إعدادات الطباعة - صفحة A5 بدون هوامش */
    /* ========================================================= */
    @page {
      size: A5 portrait;
      margin: 0;
    }

    * {
      font-family: "Tajawal", sans-serif;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* ========================================================= */
    /* تنسيق العرض في المتصفح (حجم ثابت مع تمرير) */
    /* ========================================================= */
    body {
      background: #e8e0d5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
    }

    .invoice-pages-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 100%;
    }

    /* ========================================================= */
    /* كل صفحة فاتورة بحجم A5 ثابت */
    /* ========================================================= */
    .invoice-page {
      width: 148mm;
      height: 210mm;
      background-color: #fafbf6;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      border-radius: 4px;
    }

    /* الإطار الداخلي لكل صفحة */
    .invoice-inner {
      position: absolute;
      top: 3mm;
      left: 3mm;
      right: 3mm;
      bottom: 3mm;
      border: 1px solid #420a09;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 2;
    }

    /* ========================================================= */
    /* العلامة المائية */
    /* ========================================================= */
    .watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60%;
      height: 30%;
      opacity: 0.05;
      pointer-events: none;
      z-index: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .watermark img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* ========================================================= */
    /* الهيدر */
    /* ========================================================= */
    .header {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      align-items: start;
      padding: 4mm 5mm 2mm;
      position: relative;
      z-index: 2;
      gap: 2mm;
      flex-shrink: 0;
    }

    .header-right {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .header-right .title {
      font-size: 17px;
      font-weight: 900;
      color: #420a09;
    }

    .header-right .subtitle {
      font-size: 12px;
      color: #420a09;
      font-weight: 600;
      margin-top: 1px;
    }

    .header-right .phone {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 4px;
      font-size: 24px;
      font-weight: 800;
      color: #420a09;
      justify-content: flex-end;
    }

    .logo-center {
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 2mm;
    }

    .main-logo {
      width: 38mm;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .social-box {
      border: 1px solid #420a09;
      border-radius: 6px;
      padding: 4px;
      text-align: center;
      width: 100%;
    }

    .social-icons {
      display: flex;
      gap: 13px;
      justify-content: center;
      margin-bottom: 2px;
    }

    .social-icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background-color: #420a09;
      color: #fafbf6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
    }

    .social-text {
      font-size: 18px;
      font-weight: 700;
      color: #420a09;
      line-height: 1.2;
    }

    /* ========================================================= */
    /* شريط الفاتورة */
    /* ========================================================= */
    .invoice-bar {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: center;
      padding: 2mm 5mm;
      z-index: 2;
      position: relative;
      flex-shrink: 0;
    }

    .invoice-badge-container {
      text-align: center;
    }

    .invoice-badge {
      background-color: #420a09;
      color: #fafbf6;
      padding: 4px 16px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 800;
      display: inline-block;
    }

    .invoice-no {
      font-size: 11px;
      font-weight: 700;
      color: #c0392b;
      text-align: left;
    }

    /* ========================================================= */
    /* بيانات العميل */
    /* ========================================================= */
    .customer-box {
      border: 1px solid #420a09;
      border-radius: 6px;
      margin: 2mm 5mm;
      padding: 4mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 2;
      background-color: transparent;
      height: 26mm;
      flex-shrink: 0;
    }

    .customer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #420a09;
    }

    .customer-field {
      display: flex;
      align-items: center;
    }

    .customer-label {
      font-weight: 700;
      white-space: nowrap;
    }

    .customer-value {
      border-bottom: 1px dotted #420a09;
      min-width: 20mm;
      text-align: center;
      font-weight: 600;
      margin-right: 4px;
      margin-left: 4px;
      padding-bottom: 1px;
    }

    /* ========================================================= */
    /* جدول الأصناف - يتمدد لملء المساحة */
    /* ========================================================= */
    .table-container {
      margin: 2mm 5mm;
      z-index: 2;
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .items-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .items-table th {
      background-color: #f4ebe2;
      border: 1px solid #420a09;
      padding: 4px;
      font-size: 11px;
      font-weight: 800;
      color: #420a09;
    }

    .items-table td {
      border: 1px solid #420a09;
      padding: 2px;
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: #420a09;
      height: 7mm;
    }

    .col-item {
      width: 40%;
    }
    .col-qty {
      width: 16%;
    }
    .col-price {
      width: 18%;
    }
    .col-total {
      width: 26%;
    }

    /* ========================================================= */
    /* تذييل الجدول (الإجمالي) */
    /* ========================================================= */
    .items-table tfoot td {
      border: none;
      border-top: 1.5px solid #420a09;
      background-color: transparent;
      padding: 2mm 0;
    }

    .total-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0 2px;
    }

    .total-label {
      text-align: right;
      font-weight: 800;
      font-size: 12px;
      color: #420a09;
    }

    .total-value {
      text-align: left;
      font-weight: 900;
      font-size: 16px;
      color: #420a09;
    }

    /* ========================================================= */
    /* الملاحظات */
    /* ========================================================= */
    .note-text {
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      color: #420a09;
      margin-top: 2mm;
      z-index: 2;
      position: relative;
      flex-shrink: 0;
    }

    /* ========================================================= */
    /* الموجة والتذييل */
    /* ========================================================= */
    .footer-wave {
      position: relative;
      height: 12mm;
      width: 100%;
      z-index: 2;
      margin-bottom: -1px;
      flex-shrink: 0;
    }

    .footer-content {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      align-items: center;
      z-index: 2;
      height: 26mm;
      gap: 2mm;
      flex-shrink: 0;
    }

    .qr-box {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .qr-image {
      width: 18mm;
      height: 18mm;
      object-fit: contain;
    }

    .qr-label {
      font-size: 9px;
      font-weight: 700;
      color: #420a09;
      margin-top: 3px;
    }

    .footer-center {
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .contact-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-bottom: 3px;
      font-size: 12px;
      font-weight: 700;
      color: #420a09;
    }

    .address {
      font-size: 15px;
      font-weight: 700;
      color: #420a09;
      line-height: 1.3;
      margin-top: 4px;
      margin-bottom: 6px;
    }

    .payment-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 700;
      color: #420a09;
    }

    .payment-line {
      display: inline-block;
      width: 42mm;
      height: 6mm;
      border: 1px solid #420a09;
      border-radius: 2mm;
      background-color: #fafbf6;
    }

    /* ========================================================= */
    /* أزرار التحكم (تظهر فقط في المتصفح) */
    /* ========================================================= */
    .actions {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.9);
      padding: 8px 16px;
      border-radius: 12px;
    }

    .action-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: 700;
      cursor: pointer;
      font-size: 12px;
    }

    .btn-print {
      background-color: #420a09;
    }
    .btn-back {
      background-color: #8b7355;
    }

    /* ========================================================= */
    /* الطباعة - إزالة المسافات بين الصفحات */
    /* ========================================================= */
    @media print {
      body {
        background: #fff;
        padding: 0;
        margin: 0;
      }
      .actions {
        display: none !important;
      }
      .invoice-pages-wrapper {
        display: block;
        padding: 0;
        margin: 0;
        gap: 0;
      }
      .invoice-page {
        box-shadow: none;
        border-radius: 0;
        width: 148mm;
        height: 210mm;
        page-break-after: always;
        margin: 0;
        padding: 0;
        display: block;
      }
      .invoice-page:last-child {
        page-break-after: avoid;
      }
    }

    /* ========================================================= */
    /* التمرير العمودي في المتصفح مع تكبير تلقائي */
    /* ========================================================= */
    @media screen and (max-width: 160mm) {
      .invoice-page {
        transform: scale(0.85);
        margin: -15px 0;
      }
    }
    @media screen and (max-width: 130mm) {
      .invoice-page {
        transform: scale(0.7);
        margin: -30px 0;
      }
    }
    @media screen and (max-width: 110mm) {
      .invoice-page {
        transform: scale(0.55);
        margin: -45px 0;
      }
    }
  </style>
</head>
<body>

  <div class="invoice-pages-wrapper" id="pagesWrapper">
    <!-- سيتم إنشاء الصفحات بواسطة JavaScript -->
  </div>

<!-- أزرار التحكم -->
  <div class="actions">
    <button class="action-btn btn-back" onclick="window.location.href='index.html'">رجوع</button>
    <button class="action-btn btn-print" onclick="window.print()">طباعة / PDF</button>
    <button class="action-btn btn-whatsapp" onclick="shareInvoiceWhatsApp()" style="background-color: #25D366; color: white;">
      <i class="fab fa-whatsapp" style="margin-left:4px; font-size:14px;"></i> واتساب
    </button>
  </div>

  <script src="invoice.js"></script>
</body>
</html>
